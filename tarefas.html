<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarefas Projeto Curioso</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root{--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--bg:#fff;--soft:#f4f5f7;--accent:#0c66e4;--late:#ae2e24}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{padding:16px 20px 40px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select,input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.week{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.week button{padding:4px 10px}
.chips{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chips button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 10px}
.chips button:last-child{border-right:0}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{color:var(--muted);font-size:13px;margin:0}
.err{color:var(--late)}
.load{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.load .pp{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:#fff}
.load .pp b{font-weight:600}
.load .pp .lt{color:var(--late);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
.person{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.person h2{margin:0;padding:10px 14px;font-size:15px;background:#5b3a8c;color:#fff;display:flex;justify-content:space-between;align-items:center}
.person h2 span{font-weight:400;font-size:12px;opacity:.85}
.sec{padding:8px 14px 10px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h3{margin:2px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec h4{margin:8px 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.task{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:0}
.due{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.due b{color:var(--ink)}
.due.late,.due.late b{color:var(--late)}
.tname{min-width:0}
.tname a{color:var(--ink);text-decoration:none;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname a:hover{text-decoration:underline}
.lab{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;margin-right:4px}
.right{display:flex;gap:6px;align-items:center}
.pill{border:0;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.pill.ro{cursor:default}
select.who{font-size:12px;padding:2px 4px}
.empty{padding:10px 14px;color:var(--muted);font-size:13px}
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(9,30,66,.2);padding:6px;min-width:170px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:4px 6px;border-radius:6px;text-align:left}
.menu button:hover,.menu button:focus{background:var(--soft);outline:none}
.menu .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px}
table.cfg{border-collapse:collapse;width:100%;margin-top:8px}
table.cfg th,table.cfg td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px}
table.cfg th{background:var(--soft);font-weight:600}
table.cfg select{width:100%}
.offs{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.offs label{display:flex;gap:6px;align-items:center;font-size:13px}
.offs input{width:60px}
</style>
</head>
<body>
<div id="app"><p class="note">Carregando…</p></div>
<script>
var APP_KEY = "d7dce7c9a2c664af9701e49ee088a979";
var APP_NAME = "Planilha Projeto Curioso";
var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: APP_NAME });
var app = document.getElementById("app");

var PEOPLE = ["Rodrigo", "Lucas", "Lázaro", "Vinny", "Latexi", "Helen", "Matheus", "Robert"];
/* quem pode ver as tarefas de todo mundo; o resto vê só as próprias */
var ADMINS = ["Rodrigo"];
/* como reconhecer cada pessoa pelo nome da conta no Trello */
var MATCH = { Rodrigo: /rodrigo/i, Lucas: /^lucas/i, "Lázaro": /l[aá]zaro/i, Vinny: /vinn?y/i, Latexi: /l[aá]texi/i, Helen: /helen/i, Matheus: /matt|matheus nunes/i, Robert: /robert/i };
var STAGES = [
  { k: "R", n: "Roteiro", sec: "Roteiros", f: /roteir/i },
  { k: "T", n: "Tradução", sec: "Traduções", f: /tradu/i },
  { k: "H", n: "Thumb", sec: "Thumbs", f: /thumb/i },
  { k: "E", n: "Edição", sec: "Edições", f: /edi[cç]/i },
  { k: "V", n: "Revisão", sec: "Revisões", f: null },
  { k: "P", n: "Postagem", sec: "Postagens", f: /publica/i }
];
var DEFAULT_CFG = {
  off: { R: 4, T: 4, H: 1, E: 1, V: 0, P: 0 },
  rules: {
    celebsgoat: { R: "Helen", H: "Robert", E: "Lázaro", P: "Lázaro" },
    dunkergoat: { R: "Helen", H: "Robert", E: "Lucas", P: "Lucas" },
    imnotarobot: { R: "Matheus", H: "Rodrigo", E: "Vinny", V: "Lucas", P: "Lucas" },
    nosoyrobot: { H: "Rodrigo", E: "Vinny", V: "Lucas", P: "Lucas" },
    therobotman: { R: "Matheus", H: "Rodrigo", E: "Latexi", V: "Lucas", P: "Lucas" },
    rightturn: { R: "Helen", H: "Rodrigo", E: "Lucas", P: "Lucas" },
    mysteryrobot: { E: "Lucas", P: "Lucas" }
  }
};
var COLORS = {
  green: ["#4bce97", "#0d2e20"], yellow: ["#f5cd47", "#3d2e00"], orange: ["#fea362", "#4a1f00"],
  red: ["#f87168", "#4a120d"], purple: ["#9f8fef", "#231c47"], blue: ["#579dff", "#06224a"],
  sky: ["#6cc3e0", "#0e3240"], lime: ["#94c748", "#25330f"], pink: ["#e774bb", "#40122f"],
  black: ["#44546f", "#ffffff"], none: ["#f1f2f4", "#44546f"]
};
var DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
function col(c) { if (!c) return COLORS.none; var b = c.replace(/_(light|dark)$/, ""); return COLORS[b] || COLORS.none; }
function h(tag, attrs, kids) {
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === "text") el.textContent = attrs[k];
    else if (k === "style") el.setAttribute("style", attrs[k]);
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[^a-z]/g, ""); }
function monday(x) { var d = new Date(x.getFullYear(), x.getMonth(), x.getDate()); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function addDays(x, n) { var d = new Date(x); d.setDate(d.getDate() + n); return d; }
function dd(x) { return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0"); }

var S = { cfg: null, resp: {}, me: null, view: "tarefas", person: null, week: 0, token: null };

async function load() {
  try {
    var r = await Promise.all([
      t.board("id", "labels", "customFields"),
      t.lists("id", "name"),
      t.cards("id", "name", "labels", "idList", "url", "customFieldItems"),
      t.member("id", "fullName"),
      t.get("board", "shared", "cfg"),
      t.get("board", "shared", "resp"),
      t.get("board", "private", "tarefas")
    ]);
    S.board = r[0]; S.lists = r[1]; S.cards = r[2]; S.member = r[3];
    S.cfg = r[4] || JSON.parse(JSON.stringify(DEFAULT_CFG));
    S.resp = r[5] || {};
    var cfs = S.board.customFields || [];
    S.postField = cfs.find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
    STAGES.forEach(function (s) { s.field = s.f ? cfs.find(function (f) { return f.type === "list" && s.f.test(f.name); }) : null; });
    S.editField = STAGES.find(function (s) { return s.k === "E"; }).field;
    S.me = PEOPLE.find(function (p) { return MATCH[p].test(S.member.fullName || ""); }) || null;
    var pref = r[6] || {};
    S.admin = ADMINS.indexOf(S.me) >= 0;
    S.person = S.admin ? (pref.person !== undefined ? pref.person : "") : (S.me || "?");
    try { if (await t.getRestApi().isAuthorized()) S.token = await t.getRestApi().getToken(); } catch (e) {}
    render();
  } catch (e) {
    app.replaceChildren(h("p", { class: "err", text: "Não foi possível ler o quadro: " + (e && e.message || e) }));
  }
}

function channelKey(card) {
  var keys = Object.keys(S.cfg.rules);
  for (var i = 0; i < (card.labels || []).length; i++) { var k = norm(card.labels[i].name); if (keys.indexOf(k) >= 0) return k; }
  return null;
}
function channelLabel(card) {
  var keys = Object.keys(S.cfg.rules);
  return (card.labels || []).find(function (l) { return keys.indexOf(norm(l.name)) >= 0; }) || (card.labels || [])[0];
}
function isSpanish(card) { return (card.labels || []).some(function (l) { return /no soy|esp/i.test(l.name); }) || /^ESP\b/i.test(card.name); }
function rid(card) { return card.id.slice(-8); }
function who(card, s) {
  var o = S.resp[rid(card)];
  if (o && o[s.k] !== undefined) return o[s.k];
  var ck = channelKey(card); var rule = ck ? S.cfg.rules[ck] : null;
  return rule && rule[s.k] || "";
}
function postDate(card) {
  if (!S.postField) return null;
  var it = (card.customFieldItems || []).find(function (i) { return i.idCustomField === S.postField.id; });
  return it && it.value && it.value.date ? new Date(it.value.date) : null;
}
function fieldOpt(card, f) {
  if (!f) return null;
  var it = (card.customFieldItems || []).find(function (i) { return i.idCustomField === f.id; });
  return it ? (f.options || []).find(function (o) { return o.id === it.idValue; }) : null;
}
function optText(o) { return o ? (o.value && o.value.text) || "" : ""; }
function statusOf(card, s) {
  if (s.k === "V") {
    var e = optText(fieldOpt(card, S.editField));
    if (/conclu/i.test(e)) return { text: "Concluído", color: "green", done: true };
    if (/revisar/i.test(e)) return { text: "Revisar agora", color: "purple", done: false };
    if (/corre/i.test(e)) return { text: "Em correção", color: "orange", done: false };
    return { text: "Aguardando edição", color: null, done: false };
  }
  var o = fieldOpt(card, s.field);
  var tx = optText(o);
  return { text: tx || "—", color: o && o.color, done: /conclu|publicad/i.test(tx), opt: o };
}

function buildTasks() {
  var W0 = addDays(monday(new Date()), S.week * 7), W1 = addDays(W0, 7);
  var out = [];
  S.cards.forEach(function (c) {
    var pd = postDate(c); if (!pd) return;
    STAGES.forEach(function (s) {
      var p = who(c, s); if (!p) return;
      if (s.field === undefined) return;
      if (s.f && !s.field) return;
      var due = addDays(new Date(pd.getFullYear(), pd.getMonth(), pd.getDate()), -(S.cfg.off[s.k] || 0));
      var st = statusOf(c, s);
      var inWeek = due >= W0 && due < W1;
      var overdue = due < W0 && !st.done && S.week === 0;
      if (!inWeek && !overdue) return;
      out.push({ card: c, s: s, person: p, due: due, st: st, old: overdue, late: !st.done && due < new Date(new Date().toDateString()) });
    });
  });
  out.sort(function (a, b) { return a.due - b.due; });
  return { tasks: out, W0: W0 };
}

function savePref() { try { t.set("board", "private", "tarefas", { person: S.person }); } catch (e) {} }

function render() {
  if (S.view === "config") return renderConfig();
  var b = buildTasks(), tasks = b.tasks, W0 = b.W0;
  var bar = h("div", { class: "bar" }, [
    h("span", { class: "week" }, [
      h("button", { "aria-label": "Semana anterior", text: "‹", onclick: function () { S.week--; render(); } }),
      h("span", { text: (S.week === 0 ? "Esta semana" : S.week === 1 ? "Próxima semana" : S.week === -1 ? "Semana passada" : "Semana") + " · " + dd(W0) + " a " + dd(addDays(W0, 6)) }),
      h("button", { "aria-label": "Próxima semana", text: "›", onclick: function () { S.week++; render(); } })
    ]),
    !S.admin ? null : (function () {
      var ch = h("div", { class: "chips", role: "group", "aria-label": "Pessoa" });
      [""].concat(PEOPLE).forEach(function (p) {
        ch.append(h("button", { "aria-pressed": S.person === p ? "true" : "false", text: p || "Todos", onclick: function () { S.person = p; savePref(); render(); } }));
      });
      return ch;
    })(),
    h("span", { class: "sp" }),
    S.me === "Rodrigo" ? h("button", { text: "Equipe e prazos", onclick: function () { S.view = "config"; render(); } }) : null,
    h("button", { text: "Atualizar", onclick: load })
  ]);
  var load_ = h("div", { class: "load" });
  PEOPLE.forEach(function (p) {
    var mine = tasks.filter(function (x) { return x.person === p && !x.st.done; });
    if (!mine.length) return;
    var late = mine.filter(function (x) { return x.late; }).length;
    load_.append(h("span", { class: "pp", role: "button", tabindex: "0", onclick: function () { S.person = p; savePref(); render(); } }, [h("b", { text: p }), " · " + mine.length + " em aberto", late ? h("span", { class: "lt", text: " · " + late + " atrasada" + (late > 1 ? "s" : "") }) : null]));
  });
  var grid = h("div", { class: "grid" });
  if (S.person === "?") { app.replaceChildren(bar, h("p", { class: "note", text: "Sua conta do Trello ainda não está ligada à equipe. Fale com o Rodrigo." })); return; }
  var list = S.person ? [S.person] : PEOPLE;
  list.forEach(function (p) {
    var mine = tasks.filter(function (x) { return x.person === p; });
    if (!mine.length && !S.person) return;
    grid.append(personBlock(p, mine));
  });
  var intro = S.me && S.me !== "Rodrigo" && S.person === S.me ? "Estas são as suas tarefas da semana. Mude o status quando avançar." : "Tarefas pelo prazo de entrega de cada etapa. Itens atrasados de semanas anteriores aparecem em \"Pendentes\".";
  app.replaceChildren(bar, h("p", { id: "msg", class: "note", text: intro, style: "margin-bottom:10px" }), S.person ? null : load_, grid.children.length ? grid : h("p", { class: "note", text: "Nenhuma tarefa nesta semana." }));
}

function personBlock(p, mine) {
  var box = h("section", { class: "person" });
  var open = mine.filter(function (x) { return !x.st.done; }).length;
  box.append(h("h2", {}, [p, h("span", { text: mine.length + " tarefa" + (mine.length === 1 ? "" : "s") + " · " + open + " em aberto" })]));
  if (!mine.length) { box.append(h("div", { class: "empty", text: "Nada para esta semana." })); return box; }
  var old = mine.filter(function (x) { return x.old; });
  if (old.length) box.append(section("Pendentes de semanas anteriores", old, true));
  STAGES.forEach(function (s) {
    var items = mine.filter(function (x) { return x.s.k === s.k && !x.old; });
    if (!items.length) return;
    var sec = section(s.sec, items.filter(function (x) { return !(s.k === "E" && isSpanish(x.card)); }));
    if (s.k === "E") {
      var esp = items.filter(function (x) { return isSpanish(x.card); });
      if (esp.length) { sec.append(h("h4", { text: "Espanhol" })); esp.forEach(function (x) { sec.append(taskRow(x)); }); }
    }
    box.append(sec);
  });
  return box;
}
function section(title, items, mixed) {
  var sec = h("div", { class: "sec" }, [h("h3", { text: title })]);
  items.forEach(function (x) { sec.append(taskRow(x, mixed)); });
  return sec;
}
function taskRow(x, mixed) {
  var lb = channelLabel(x.card), cc = col(lb && lb.color);
  var st = x.st, sc = col(st.color);
  var pill = h("button", { class: "pill" + (x.s.field ? "" : " ro"), style: st.color ? "background:" + sc[0] + ";color:" + sc[1] : "background:#f1f2f4;color:#5e6c84", text: st.text });
  if (x.s.field) pill.addEventListener("click", function () { openMenu(pill, x); });
  var right = h("div", { class: "right" }, [pill]);
  if (S.me === "Rodrigo") {
    var sel = h("select", { class: "who", "aria-label": "Quem faz " + x.s.n });
    PEOPLE.forEach(function (p) { var o = h("option", { value: p, text: p }); if (p === x.person) o.selected = true; sel.append(o); });
    sel.append(h("option", { value: "", text: "Ninguém" }));
    sel.addEventListener("change", function () { setWho(x.card, x.s, sel.value); });
    right.append(sel);
  }
  return h("div", { class: "task" }, [
    h("span", { class: "due" + (x.late ? " late" : "") }, [h("b", { text: DIAS[x.due.getDay()] + " " + dd(x.due) }), x.late ? " · atrasado" : ""]),
    h("span", { class: "tname" }, [h("a", { href: x.card.url, text: x.card.name, title: x.card.name, onclick: function (e) { e.preventDefault(); t.showCard(x.card.id); } }), lb ? h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: lb.name }) : null, mixed ? h("span", { class: "note", style: "display:inline;font-size:11px", text: x.s.n }) : null]),
    right
  ]);
}

async function setWho(card, s, p) {
  var id = rid(card), ck = channelKey(card), def = ck ? (S.cfg.rules[ck] || {})[s.k] || "" : "";
  var o = Object.assign({}, S.resp[id] || {});
  if (p === def) delete o[s.k]; else o[s.k] = p;
  if (Object.keys(o).length) S.resp[id] = o; else delete S.resp[id];
  /* limpa exceções de cartões que não existem mais no quadro */
  var alive = {}; S.cards.forEach(function (c) { alive[rid(c)] = 1; });
  Object.keys(S.resp).forEach(function (k) { if (!alive[k]) delete S.resp[k]; });
  try { await t.set("board", "shared", "resp", S.resp); } catch (e) { msg("Não salvou: " + (e.message || e)); }
  render();
}
function msg(tx) { var n = document.getElementById("msg"); if (n) { n.textContent = tx; n.className = "note err"; } }

/* ---------- menu de status ---------- */
var MENU = null;
function closeMenu() { if (MENU) { MENU.remove(); MENU = null; } }
document.addEventListener("mousedown", function (e) { if (MENU && !MENU.contains(e.target) && e.target !== MENU._owner) closeMenu(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
function openMenu(btn, x) {
  closeMenu();
  var f = x.s.field, cur = x.st.opt ? x.st.opt.id : "";
  var menu = h("div", { class: "menu", role: "listbox" });
  [{ id: "", text: "—" }].concat((f.options || []).map(function (o) { return { id: o.id, text: optText(o), o: o }; })).forEach(function (op) {
    var c = col(op.o && op.o.color);
    var b = h("button", { role: "option" }, [h("span", { class: "chip", style: op.o ? "background:" + c[0] + ";color:" + c[1] : "background:#f1f2f4;color:#8590a2", text: op.text }), op.id === cur ? h("span", { text: "✓", style: "color:#0c66e4" }) : null]);
    b.addEventListener("click", function () { closeMenu(); if (op.id !== cur) setStatus(x.card, f, op.id); });
    menu.append(b);
  });
  document.body.append(menu); MENU = menu; menu._owner = btn;
  var r = btn.getBoundingClientRect(), mh = menu.offsetHeight;
  var top = r.bottom + 4; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
}
async function setStatus(card, f, idValue) {
  if (!S.token) {
    try { await t.getRestApi().authorize({ scope: "read,write", expiration: "never" }); S.token = await t.getRestApi().getToken(); }
    catch (e) { msg("Para mudar o status, autorize a edição."); return; }
  }
  try {
    var res = await fetch("https://api.trello.com/1/cards/" + card.id + "/customField/" + f.id + "/item?key=" + APP_KEY + "&token=" + S.token, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(idValue ? { idValue: idValue } : { idValue: "", value: "" }) });
    if (!res.ok) { if (res.status === 401) S.token = null; throw new Error(res.status); }
    card.customFieldItems = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
    if (idValue) card.customFieldItems.push({ idCustomField: f.id, idValue: idValue });
    render();
  } catch (e) { msg("Não salvou (" + e.message + ")."); }
}

/* ---------- ajustes: equipe e prazos ---------- */
function renderConfig() {
  var cfg = JSON.parse(JSON.stringify(S.cfg));
  var labels = (S.board.labels || []).filter(function (l) { return l.name && /robot|goat|turn|soy|celebs|dunker|mystery|bean|mariner/i.test(l.name); });
  labels.forEach(function (l) { var k = norm(l.name); if (!cfg.rules[k]) cfg.rules[k] = {}; });
  var tb = h("tbody");
  Object.keys(cfg.rules).forEach(function (k) {
    var lb = (S.board.labels || []).find(function (l) { return norm(l.name) === k; });
    var cc = col(lb && lb.color);
    var tr = h("tr", {}, [h("td", {}, [h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: lb ? lb.name : k })])]);
    STAGES.forEach(function (s) {
      var sel = h("select", { "aria-label": s.n + " em " + (lb ? lb.name : k) });
      sel.append(h("option", { value: "", text: "—" }));
      PEOPLE.forEach(function (p) { var o = h("option", { value: p, text: p }); if (cfg.rules[k][s.k] === p) o.selected = true; sel.append(o); });
      sel.addEventListener("change", function () { if (sel.value) cfg.rules[k][s.k] = sel.value; else delete cfg.rules[k][s.k]; });
      tr.append(h("td", {}, [sel]));
    });
    tb.append(tr);
  });
  var offs = h("div", { class: "offs" });
  STAGES.forEach(function (s) {
    var inp = h("input", { type: "number", min: "0", max: "30", value: String(cfg.off[s.k] || 0) });
    inp.addEventListener("input", function () { cfg.off[s.k] = Math.max(0, parseInt(inp.value || "0", 10)); });
    offs.append(h("label", {}, [s.n, inp]));
  });
  app.replaceChildren(
    h("div", { class: "bar" }, [h("button", { text: "‹ Voltar às tarefas", onclick: function () { S.view = "tarefas"; render(); } }), h("span", { class: "sp" }),
      h("button", { class: "primary", text: "Salvar", onclick: async function () { try { await t.set("board", "shared", "cfg", cfg); S.cfg = cfg; S.view = "tarefas"; render(); } catch (e) { msg("Não salvou: " + (e.message || e)); } } })]),
    h("p", { id: "msg", class: "note", text: "Quem faz cada etapa por padrão em cada canal. Em cada vídeo dá para trocar a pessoa direto na lista de tarefas." }),
    h("table", { class: "cfg" }, [h("thead", {}, [h("tr", {}, [h("th", { text: "Canal" })].concat(STAGES.map(function (s) { return h("th", { text: s.n }); })))]), tb]),
    h("h3", { text: "Prazo de entrega: dias antes da postagem", style: "font-size:14px;margin:18px 0 0" }),
    offs
  );
}

load();
