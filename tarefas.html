<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarefas Projeto Curioso</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root{--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--bg:#fff;--soft:#f4f5f7;--accent:#0c66e4;--late:#ae2e24}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{padding:16px 20px 40px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.week{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.week button{padding:4px 10px}
.chips{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chips button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 10px}
.chips button:last-child{border-right:0}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{color:var(--muted);font-size:13px;margin:0}
.err{color:var(--late)}
.load{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.load .pp{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:#fff}
.load .pp b{font-weight:600}
.load .pp .lt{color:var(--late);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
.person{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.person h2{margin:0;padding:10px 14px;font-size:15px;background:#5b3a8c;color:#fff;display:flex;justify-content:space-between;align-items:center}
.person h2 span{font-weight:400;font-size:12px;opacity:.85}
.sec{padding:8px 14px 10px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h3{margin:2px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec h4{margin:8px 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.sec.nextw{background:rgba(9,30,66,.035);border-top:2px dashed var(--line)}
.nextnote{margin:-2px 0 6px;font-size:12px;color:var(--muted)}
.task{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:0}
.due{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.due b{color:var(--ink)}
.due.late,.due.late b{color:var(--late)}
.tname{min-width:0}
.tname a{color:var(--ink);text-decoration:none;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname a:hover{text-decoration:underline}
.lab{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;margin-right:4px}
.post{font-size:11px;color:var(--muted)}
.pill{border:0;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.pill.ro{cursor:default}
.acts{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.move{border:1px solid #0c66e4;color:#0c66e4;background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.move:hover{background:#e9f2ff}
.menu .mhead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 6px 6px}
.menu .sug{font-size:11px;color:#0c66e4}
.empty{padding:10px 14px;color:var(--muted);font-size:13px}
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(9,30,66,.2);padding:6px;min-width:170px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:4px 6px;border-radius:6px;text-align:left}
.menu button:hover,.menu button:focus{background:var(--soft);outline:none}
.menu .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px}
.gate{max-width:520px;margin:40px auto;text-align:center}
.gate p{margin:0 0 14px}
</style>
</head>
<body>
<div id="app"><p class="note">Carregando…</p></div>
<script>
/* As tarefas vêm do checklist de produção de cada cartão: o item, a pessoa colocada nele e a data dele. */
var APP_KEY = "d7dce7c9a2c664af9701e49ee088a979";
var APP_NAME = "Planilha Projeto Curioso";
var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: APP_NAME });
var app = document.getElementById("app");

/* quem vê as tarefas de todo mundo (pelo nome da conta no Trello); o resto vê só as próprias */
var ADMINS = [/rodrigo/i];
/* checklists que não são tarefa de produção */
var IGNORE_CHECKLIST = /aprova/i;
/* seções na ordem em que aparecem; "m" é a ordem em que o nome do item é testado (o mais específico primeiro) */
var SECTIONS = [
  { k: "A", n: "Temas", m: 1, re: /^tema/i, f: null },
  { k: "R", n: "Roteiros", m: 8, re: /roteir/i, f: /roteir/i },
  { k: "RR", n: "Revisão de roteiro", m: 3, re: /revis.*roteir/i, f: null },
  { k: "T", n: "Traduções", m: 7, re: /tradu/i, f: /tradu/i },
  { k: "B", n: "Brainstorm de thumb", m: 2, re: /brainstorm/i, f: null },
  { k: "H", n: "Thumbs", m: 9, re: /thumb/i, f: /thumb/i },
  { k: "E", n: "Edições", m: 10, re: /edi[cç]|montagem/i, f: /edi[cç]/i },
  { k: "V", n: "Revisão de vídeo", m: 4, re: /revis/i, f: null },
  { k: "M", n: "Metadados", m: 5, re: /metadado/i, f: null },
  { k: "P", n: "Postagens", m: 6, re: /postagem|publica/i, f: /publica/i },
  { k: "O", n: "Outras", m: 99, re: /./, f: null }
];
var MATCH = SECTIONS.slice().sort(function (a, b) { return a.m - b.m; });
var COLORS = {
  green: ["#4bce97", "#0d2e20"], yellow: ["#f5cd47", "#3d2e00"], orange: ["#fea362", "#4a1f00"],
  red: ["#f87168", "#4a120d"], purple: ["#9f8fef", "#231c47"], blue: ["#579dff", "#06224a"],
  sky: ["#6cc3e0", "#0e3240"], lime: ["#94c748", "#25330f"], pink: ["#e774bb", "#40122f"],
  black: ["#44546f", "#ffffff"], none: ["#f1f2f4", "#44546f"]
};
var DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
function col(c) { if (!c) return COLORS.none; var b = c.replace(/_(light|dark)$/, ""); return COLORS[b] || COLORS.none; }
function h(tag, attrs, kids) {
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === "text") el.textContent = attrs[k];
    else if (k === "style") el.setAttribute("style", attrs[k]);
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c != null && c !== "") el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function monday(x) { var d = new Date(x.getFullYear(), x.getMonth(), x.getDate()); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function addDays(x, n) { var d = new Date(x); d.setDate(d.getDate() + n); return d; }
function day(x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()); }
function dd(x) { return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0"); }
function first(name) { return (name || "").trim().split(/\s+/)[0].replace(/^./, function (c) { return c.toUpperCase(); }); }

var S = { person: null, week: 0, token: null };

async function load() {
  try {
    var r = await Promise.all([
      t.board("id", "labels", "customFields", "members"),
      t.cards("id", "name", "labels", "idList", "url", "customFieldItems", "closed", "dueComplete"),
      t.member("id", "fullName"),
      t.get("board", "private", "tarefas"),
      t.lists("id", "name")
    ]);
    S.lists = r[4] || [];
    S.board = r[0]; S.cards = r[1]; S.member = r[2];
    S.admin = ADMINS.some(function (re) { return re.test(S.member.fullName || ""); });
    var pref = r[3] || {};
    S.person = S.admin ? (pref.person || "") : S.member.id;
    var cfs = S.board.customFields || [];
    S.postField = cfs.find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
    SECTIONS.forEach(function (s) { s.field = s.f ? cfs.find(function (f) { return f.type === "list" && s.f.test(f.name); }) : null; });
    S.editField = SECTIONS.find(function (s) { return s.k === "E"; }).field;
    try { if (await t.getRestApi().isAuthorized()) S.token = await t.getRestApi().getToken(); } catch (e) {}
    if (!S.token) return renderGate();
    var cr = await fetch("https://api.trello.com/1/boards/" + S.board.id + "/cards?fields=id&checklists=all&checklist_fields=name,pos&key=" + APP_KEY + "&token=" + S.token);
    if (cr.status === 401) { S.token = null; return renderGate(); }
    if (!cr.ok) throw new Error(cr.status);
    S.checks = {};
    (await cr.json()).forEach(function (c) { S.checks[c.id] = c.checklists || []; });
    render();
    /* acerta os status pela lista e pelo checklist em segundo plano, depois redesenha */
    try { var regras = (await t.get("board", "shared", "regras")) || {}; await syncByList({ cards: S.cards, lists: S.lists, fields: S.board.customFields, postDate: postDate, checklists: S.checks, call: api, boardId: S.board.id, saved: regras, labels: S.board.labels }); } catch (e) {}
    await reconcile();
    render();
  } catch (e) {
    app.replaceChildren(h("p", { class: "err", text: "Não foi possível ler o quadro: " + (e && e.message || e) }));
  }
}

/* o checklist só pode ser lido com a permissão da pessoa (uma vez só) */
function renderGate() {
  app.replaceChildren(h("div", { class: "gate" }, [
    h("p", { text: "Para ver suas tarefas, libere o acesso uma vez. Depois disso abre direto." }),
    h("button", { class: "primary", text: "Liberar acesso", onclick: async function () {
      try { await t.getRestApi().authorize({ scope: "read,write", expiration: "never" }); load(); }
      catch (e) { app.querySelector(".gate p").textContent = "Acesso não liberado. Tente de novo."; }
    } })
  ]));
}

function memberName(id) { var m = (S.board.members || []).find(function (x) { return x.id === id; }); return m ? first(m.fullName) : "Sem conta no quadro"; }
function channelLabel(card) { return (card.labels || []).find(function (l) { return l.name && !/travado|ingl/i.test(l.name); }) || null; }
function isSpanish(card) { return (card.labels || []).some(function (l) { return /no soy|esp/i.test(l.name); }) || /^ESP\b/i.test(card.name); }
function postDate(card) {
  if (!S.postField) return null;
  var it = (card.customFieldItems || []).find(function (i) { return i.idCustomField === S.postField.id; });
  return it && it.value && it.value.date ? new Date(it.value.date) : null;
}
function fieldOpt(card, f) {
  if (!f) return null;
  var it = (card.customFieldItems || []).find(function (i) { return i.idCustomField === f.id; });
  return it ? (f.options || []).find(function (o) { return o.id === it.idValue; }) : null;
}
function optText(o) { return o ? (o.value && o.value.text) || "" : ""; }

/* status: o do campo personalizado da etapa; se não houver, o item marcado ou não no checklist */
function statusOf(card, sec, item) {
  if (sec.field) {
    var o = fieldOpt(card, sec.field), tx = optText(o);
    var done = item.state === "complete";
    return { text: tx || (item.state === "complete" ? "Feito" : "—"), color: o ? o.color : (done ? "green" : null), done: done, opt: o, field: sec.field };
  }
  return item.state === "complete" ? { text: "Feito", color: "green", done: true } : { text: "A fazer", color: null, done: false };
}

function findOpt(f, re) { return (f.options || []).find(function (o) { return re.test(optText(o)); }); }
function api(method, path, body) {
  return fetch("https://api.trello.com/1" + path + (path.indexOf("?") < 0 ? "?" : "&") + "key=" + APP_KEY + "&token=" + S.token, { method: method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r; });
}
async function putField(card, f, idValue) {
  await api("PUT", "/cards/" + card.id + "/customField/" + f.id + "/item", { idValue: idValue });
  card.customFieldItems = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
  card.customFieldItems.push({ idCustomField: f.id, idValue: idValue });
}
function cardItems(c) {
  var out = [];
  (S.checks[c.id] || []).forEach(function (cl) { if (IGNORE_CHECKLIST.test(cl.name)) return; (cl.checkItems || []).forEach(function (it) { out.push(it); }); });
  return out;
}
/* o checklist manda: se alguém marcou ou desmarcou o item direto no cartão, o status da etapa acompanha */
async function reconcile() {
  var jobs = [];
  S.cards.forEach(function (c) {
    if (c.closed || /^TEMPLATE/i.test(c.name)) return;
    var byField = {};
    (S.checks[c.id] || []).forEach(function (cl) {
      if (IGNORE_CHECKLIST.test(cl.name)) return;
      (cl.checkItems || []).forEach(function (it) {
        if (!it.idMember || !it.due) return;
        var sec = MATCH.find(function (s) { return s.re.test(it.name.trim()); });
        if (!sec || !sec.field) return;
        (byField[sec.field.id] = byField[sec.field.id] || { f: sec.field, items: [] }).items.push(it);
      });
    });
    Object.keys(byField).forEach(function (k) {
      var g = byField[k]; if (g.items.length !== 1) return;
      var it = g.items[0], f = g.f;
      var idone = it.state === "complete", target;
      if (/roteir/i.test(f.name)) {
        /* roteiro: entregue e sem a revisão feita = Revisar; revisão do roteiro feita = Concluído */
        var cur = optText(fieldOpt(c, f));
        var rev = cardItems(c).find(function (x) { return RRV.test(x.name.trim()); });
        var want = !idone ? "open" : (rev && rev.state !== "complete" ? "rev" : "done");
        var have = /conclu/i.test(cur) ? "done" : (/revisar|corre/i.test(cur) ? "rev" : "open");
        if (want === have) return;
        target = want === "done" ? findOpt(f, /conclu/i) : want === "rev" ? findOpt(f, /revisar/i) : (findOpt(f, /execu|agendad/i) || findOpt(f, /n[aã]o inic/i));
      } else {
        var fdone = /conclu|publicad/i.test(optText(fieldOpt(c, f)));
        if (fdone === idone) return;
        target = idone ? findOpt(f, /conclu|publicad/i) : (findOpt(f, /execu|agendad/i) || findOpt(f, /n[aã]o inic/i));
      }
      if (target) jobs.push(putField(c, f, target.id).catch(function () {}));
    });
  });
  await Promise.all(jobs);
}

/* depois de concluir, para qual lista o cartão costuma ir */
var NEXT = { R: /revis.*rotei/i, RR: /tradu/i, T: /fila.*edi/i, E: /revis.*v[ií]deo/i, V: /aprovad/i, P: /postad/i };
function nextList(x) {
  var re = NEXT[x.sec.k]; if (!re) return null;
  var tgt = S.lists.find(function (l) { return re.test(l.name); }); if (!tgt) return null;
  var ids = S.lists.map(function (l) { return l.id; });
  var cur = ids.indexOf(x.card.idList);
  return cur >= 0 && cur < ids.indexOf(tgt.id) ? tgt : null;
}
function listName(id) { var l = S.lists.find(function (x) { return x.id === id; }); return l ? l.name : ""; }
async function moveCard(x, list) {
  try {
    await api("PUT", "/cards/" + x.card.id, { idList: list.id, pos: "bottom" });
    x.card.idList = list.id;
    render();
    var n = document.getElementById("msg"); if (n) { n.textContent = "\u201C" + x.card.name + "\u201D foi para " + list.name + "."; n.className = "note"; }
  } catch (e) { var m = document.getElementById("msg"); if (m) { m.textContent = "Não moveu (" + e.message + ")."; m.className = "note err"; } }
}
function openMoveMenu(btn, x, sug) {
  closeMenu();
  var menu = h("div", { class: "menu", role: "listbox" }, [h("div", { class: "mhead", text: "Mover o cartão para" })]);
  [sug].concat(S.lists.filter(function (l) { return l.id !== sug.id && l.id !== x.card.idList; })).forEach(function (l, i) {
    var b = h("button", { role: "option" }, [h("span", { text: l.name, style: i === 0 ? "font-weight:600" : "" }), i === 0 ? h("span", { class: "sug", text: "próxima etapa" }) : ""]);
    b.addEventListener("click", function () { closeMenu(); moveCard(x, l); });
    menu.append(b);
  });
  document.body.append(menu); MENU = menu; menu._owner = btn;
  var r = btn.getBoundingClientRect(), mh = menu.offsetHeight;
  var top = r.bottom + 4; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(8, Math.min(r.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 8)) + "px";
}

/* Regras automáticas: a lista em que o cartão está define o status mínimo de cada etapa (o que já está mais adiantado não volta).
   As regras ficam salvas no quadro ("Regras" na Planilha); sem regra salva, vale o padrão abaixo.
   Também: em ESCREVENDO o roteiro vira Atrasado se passou do prazo do item do roteiro, e o cartão ganha o checklist de produção se não tiver.
   Só mexe em vídeos com postagem dos últimos 30 dias para frente. */
var TPL_CHECKLIST_ID = "6ad69a8e90a4f4636a5c41a4";
var FIELD_KEYS = [["R", /roteir/i], ["T", /tradu/i], ["E", /edi[cç]/i], ["P", /publica/i]];
/* o brainstorm de thumb nunca é marcado sozinho: só quando o brainstorm é enviado ao thumbmaker */
var RT = [/^tema/i], RR = /produ.*rotei|^roteiro$/i, RRV = /revis.*rotei/i;
/* quando a etapa fica Concluída, estes itens do checklist são marcados */
var ITEMS_BY_FIELD = { R: [RR, RRV], T: [/tradu/i], E: [/edi[cç]|montagem/i, /revis.*v[ií]deo/i], P: [/postag|publica/i] };
/* quando a etapa fica em Revisar, a produção dela já foi entregue: marca só o item de produção */
var ITEMS_AT_REVIEW = { R: [RR], E: [/edi[cç]|montagem/i] };
var DEFAULT_RULES = [
  [/escrevendo/i, { R: "Em execução" }],
  [/revis.*rotei/i, { R: "Revisar" }],
  [/^tradu/i, { R: "Concluído", T: "Em execução" }],
  [/fila.*edi/i, { R: "Concluído", T: "Concluído" }],
  [/editando/i, { R: "Concluído", T: "Concluído", E: "Em execução" }],
  [/revis.*v[ií]deo/i, { R: "Concluído", T: "Concluído", E: "Revisar" }],
  [/aprovad/i, { R: "Concluído", T: "Concluído", E: "Concluído", P: "Em execução" }],
  [/postado/i, { R: "Concluído", T: "Concluído", E: "Concluído", P: "Publicado", done: true }]
];
/* canais automatizados (o app faz roteiro, tradução e edição juntos): regras próprias, escolhidas na tela de Regras */
var AUTO_RE = /mystery|bean/i;
var AUTO_DEFAULT = [
  [/fila.*edi/i, { R: "Em execução", T: "Em execução", E: "Em execução" }],
  [/editando/i, { R: "Em execução", T: "Em execução", E: "Em execução" }],
  [/revis.*v[ií]deo/i, { R: "Concluído", T: "Concluído", E: "Revisar" }],
  [/aprovad/i, { R: "Concluído", T: "Concluído", E: "Concluído", P: "Em execução" }],
  [/postado/i, { R: "Concluído", T: "Concluído", E: "Concluído", P: "Publicado", done: true }]
];
function autoLabels(labels, saved) {
  if (saved && saved._auto && saved._auto.labels) return saved._auto.labels;
  return (labels || []).filter(function (l) { return l.name && AUTO_RE.test(l.name); }).map(function (l) { return l.id; });
}
function statusRank(txt) {
  if (!txt || /n[aã]o inic/i.test(txt)) return 0;
  if (/conclu|publicad/i.test(txt)) return 4;
  if (/revisar|corre/i.test(txt)) return 3;
  if (/atrasad/i.test(txt)) return 2;
  return 1;
}
/* regras por lista: as salvas no quadro ou o padrão */
function rulesFor(lists, saved, defs) {
  var out = {};
  lists.forEach(function (l) {
    if (saved && saved[l.id]) { out[l.id] = saved[l.id]; return; }
    var d = (defs || DEFAULT_RULES).find(function (x) { return x[0].test(l.name); });
    if (d) out[l.id] = d[1];
  });
  return out;
}
async function syncByList(o) {
  var rules = rulesFor(o.lists, o.saved);
  var autoR = rulesFor(o.lists, o.saved && o.saved._auto && o.saved._auto.rules, AUTO_DEFAULT), autoIds = autoLabels(o.labels, o.saved);
  var last = o.lists.findIndex(function (l) { return /postado/i.test(l.name); });
  var cut = new Date(); cut.setDate(cut.getDate() - 30);
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todo = [];
  o.cards.forEach(function (c) {
    if (/^TEMPLATE/i.test(c.name)) return;
    var pd = o.postDate(c); if (!pd || pd < cut) return;
    var li = o.lists.findIndex(function (l) { return l.id === c.idList; });
    if (li < 0 || (last >= 0 && li > last)) return;
    var isAuto = (c.labels || []).some(function (x) { return autoIds.indexOf(x.id) >= 0; });
    var rr = (isAuto ? autoR : rules)[c.idList];
    if (rr) todo.push({ c: c, r: rr, writing: /escrevendo/i.test(o.lists[li].name) });
  });
  if (!todo.length) return 0;
  var checks = o.checklists;
  if (!checks) {
    checks = {};
    var all = await (await o.call("GET", "/boards/" + o.boardId + "/checklists?checkItem_fields=name,state,due")).json();
    all.forEach(function (cl) { (checks[cl.idCard] = checks[cl.idCard] || []).push(cl); });
  }
  var n = 0;
  for (var i = 0; i < todo.length; i++) {
    var c = todo[i].c, r = todo[i].r;
    var cls = (checks[c.id] || []).filter(function (cl) { return !/aprova/i.test(cl.name); });
    if (todo[i].writing && !cls.length) { await o.call("POST", "/cards/" + c.id + "/checklists", { idChecklistSource: TPL_CHECKLIST_ID }); n++; continue; }
    var items = []; cls.forEach(function (cl) { (cl.checkItems || []).forEach(function (it) { items.push(it); }); });
    var set = {}; FIELD_KEYS.forEach(function (fk) { if (r[fk[0]]) set[fk[0]] = r[fk[0]]; });
    if (todo[i].writing && items.some(function (it) { return RR.test(it.name) && it.state !== "complete" && it.due && new Date(it.due) < today; })) set.R = "Atrasado";
    var chk = RT.slice();
    for (var k = 0; k < FIELD_KEYS.length; k++) {
      var key = FIELD_KEYS[k][0], txt = set[key]; if (!txt) continue;
      if (statusRank(txt) === 4) chk = chk.concat(ITEMS_BY_FIELD[key]);
      else if (statusRank(txt) === 3 && ITEMS_AT_REVIEW[key]) chk = chk.concat(ITEMS_AT_REVIEW[key]);
      var f = (o.fields || []).find(function (x) { return x.type === "list" && FIELD_KEYS[k][1].test(x.name); });
      if (!f) continue;
      var cur = (c.customFieldItems || []).find(function (x) { return x.idCustomField === f.id; });
      var opt = cur && (f.options || []).find(function (op) { return op.id === cur.idValue; });
      if (statusRank(opt && opt.value.text) >= statusRank(txt)) continue;
      var want = (f.options || []).find(function (op) { return op.value.text.trim().toLowerCase() === txt.trim().toLowerCase(); });
      if (!want) continue;
      await o.call("PUT", "/cards/" + c.id + "/customField/" + f.id + "/item", { idValue: want.id });
      c.customFieldItems = (c.customFieldItems || []).filter(function (x) { return x.idCustomField !== f.id; }).concat([{ idCustomField: f.id, idValue: want.id }]);
      n++;
    }
    for (var b = 0; b < items.length; b++) {
      var it = items[b];
      if (it.state === "complete" || !chk.some(function (re) { return re.test(it.name.trim()); })) continue;
      await o.call("PUT", "/cards/" + c.id + "/checkItem/" + it.id, { state: "complete" });
      it.state = "complete"; n++;
    }
    if (r.done && !c.dueComplete) { await o.call("PUT", "/cards/" + c.id, { dueComplete: true }); c.dueComplete = true; n++; }
  }
  return n;
}


function buildTasks() {
  var W0 = addDays(monday(new Date()), S.week * 7), W1 = addDays(W0, 7), today = day(new Date());
  var out = [];
  S.cards.forEach(function (c) {
    if (c.closed || /^TEMPLATE/i.test(c.name)) return;
    (S.checks[c.id] || []).forEach(function (cl) {
      if (IGNORE_CHECKLIST.test(cl.name)) return;
      (cl.checkItems || []).forEach(function (it) {
        if (!it.idMember || !it.due) return;
        var sec = MATCH.find(function (s) { return s.re.test(it.name.trim()); });
        var due = day(new Date(it.due));
        var st = statusOf(c, sec, it);
        var inWeek = due >= W0 && due < W1;
        var old = due < W0 && !st.done && S.week === 0;
        var next = due >= W1 && due < addDays(W1, 7);
        if (!inWeek && !old && !next) return;
        out.push({ card: c, item: it, sec: sec, who: it.idMember, due: due, st: st, old: old, next: next, late: !st.done && due < today, post: postDate(c) });
      });
    });
  });
  out.sort(function (a, b) { return a.due - b.due; });
  return { tasks: out, W0: W0 };
}

function savePref() { try { t.set("board", "private", "tarefas", { person: S.person }); } catch (e) {} }

function render() {
  var b = buildTasks(), tasks = b.tasks, W0 = b.W0;
  var people = [];
  tasks.forEach(function (x) { if (people.indexOf(x.who) < 0) people.push(x.who); });
  people.sort(function (a, b) { return memberName(a).localeCompare(memberName(b)); });
  if (S.admin && S.person && people.indexOf(S.person) < 0) people.push(S.person);
  var bar = h("div", { class: "bar" }, [
    h("span", { class: "week" }, [
      h("button", { "aria-label": "Semana anterior", text: "‹", onclick: function () { S.week--; render(); } }),
      h("span", { text: (S.week === 0 ? "Esta semana" : S.week === 1 ? "Próxima semana" : S.week === -1 ? "Semana passada" : "Semana") + " · " + dd(W0) + " a " + dd(addDays(W0, 6)) }),
      h("button", { "aria-label": "Próxima semana", text: "›", onclick: function () { S.week++; render(); } })
    ]),
    !S.admin ? null : (function () {
      var ch = h("div", { class: "chips", role: "group", "aria-label": "Pessoa" });
      [""].concat(people).forEach(function (p) {
        ch.append(h("button", { "aria-pressed": S.person === p ? "true" : "false", text: p ? memberName(p) : "Todos", onclick: function () { S.person = p; savePref(); render(); } }));
      });
      return ch;
    })(),
    h("span", { class: "sp" }),
    h("button", { text: "Atualizar", onclick: load })
  ]);
  var intro = S.admin ? "Tarefas tiradas do checklist de cada cartão: o item, a pessoa e a data colocadas nele." : "Estas são as suas tarefas, tiradas do checklist dos cartões. Mude o status quando avançar.";
  var loadBar = "";
  if (S.admin && !S.person) {
    loadBar = h("div", { class: "load" });
    people.forEach(function (p) {
      var mine = tasks.filter(function (x) { return x.who === p && !x.st.done && !x.next; });
      if (!mine.length) return;
      var late = mine.filter(function (x) { return x.late; }).length;
      loadBar.append(h("span", { class: "pp", role: "button", tabindex: "0", onclick: function () { S.person = p; savePref(); render(); } }, [h("b", { text: memberName(p) }), " · " + mine.length + " em aberto", late ? h("span", { class: "lt", text: " · " + late + " atrasada" + (late > 1 ? "s" : "") }) : ""]));
    });
  }
  var grid = h("div", { class: "grid" });
  (S.person ? [S.person] : people).forEach(function (p) {
    grid.append(personBlock(p, tasks.filter(function (x) { return x.who === p; })));
  });
  app.replaceChildren(bar, h("p", { id: "msg", class: "note", text: intro, style: "margin-bottom:10px" }), loadBar, grid.children.length ? grid : h("p", { class: "note", text: "Nenhuma tarefa nesta semana." }));
}

function personBlock(p, all) {
  var mine = all.filter(function (x) { return !x.next; }), nextItems = all.filter(function (x) { return x.next; });
  var box = h("section", { class: "person" });
  var open = mine.filter(function (x) { return !x.st.done; }).length;
  box.append(h("h2", {}, [memberName(p), h("span", { text: mine.length + " tarefa" + (mine.length === 1 ? "" : "s") + " · " + open + " em aberto" })]));
  if (!mine.length) { box.append(h("div", { class: "empty", text: "Nada para esta semana." })); if (nextItems.length) box.append(nextSection(nextItems)); return box; }
  var old = mine.filter(function (x) { return x.old; });
  if (old.length) box.append(section("Pendentes de semanas anteriores", old, true));
  SECTIONS.forEach(function (s) {
    var items = mine.filter(function (x) { return x.sec === s && !x.old; });
    if (!items.length) return;
    var sec = section(s.n, items.filter(function (x) { return !(s.k === "E" && isSpanish(x.card)); }), s.k === "O");
    if (s.k === "E") {
      var esp = items.filter(function (x) { return isSpanish(x.card); });
      if (esp.length) { sec.append(h("h4", { text: "Espanhol" })); esp.forEach(function (x) { sec.append(taskRow(x)); }); }
    }
    box.append(sec);
  });
  if (nextItems.length) box.append(nextSection(nextItems));
  return box;
}
/* prévia da semana seguinte: o que já tem data, para ninguém ser pego de surpresa na segunda */
function nextSection(items) {
  var n0 = addDays(addDays(monday(new Date()), S.week * 7), 7);
  var sec = h("div", { class: "sec nextw" }, [
    h("h3", { text: (S.week === 0 ? "Próxima semana" : "Semana seguinte") + " · " + dd(n0) + " a " + dd(addDays(n0, 6)) }),
    h("p", { class: "nextnote", text: "Prévia: o que já tem data. Ainda pode entrar mais coisa até lá." })
  ]);
  items.forEach(function (x) { sec.append(taskRow(x, true)); });
  return sec;
}
function section(title, items, showItem) {
  var sec = h("div", { class: "sec" }, [h("h3", { text: title })]);
  items.forEach(function (x) { sec.append(taskRow(x, showItem)); });
  return sec;
}
function taskRow(x, showItem) {
  var lb = channelLabel(x.card), cc = col(lb && lb.color);
  var st = x.st, sc = col(st.color);
  var pill = h("button", { class: "pill", style: st.color ? "background:" + sc[0] + ";color:" + sc[1] : "background:#f1f2f4;color:#5e6c84", text: st.text });
  pill.addEventListener("click", function () { openMenu(pill, x); });
  var sug = x.st.done ? nextList(x) : null, mv = null;
  if (sug) { mv = h("button", { class: "move", title: "Mover o cartão para " + sug.name, text: "Próxima etapa \u203A" }); mv.addEventListener("click", function () { openMoveMenu(mv, x, sug); }); }
  return h("div", { class: "task" }, [
    h("span", { class: "due" + (x.late ? " late" : "") }, [h("b", { text: DIAS[x.due.getDay()] + " " + dd(x.due) }), x.late ? " · atrasado" : ""]),
    h("span", { class: "tname" }, [
      h("a", { href: x.card.url, text: x.card.name, title: x.card.name, onclick: function (e) { e.preventDefault(); t.showCard(x.card.id); } }),
      lb ? h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: lb.name }) : "",
      showItem ? h("span", { class: "post", text: x.item.name + " · " }) : "",
      x.post ? h("span", { class: "post", text: "posta " + DIAS[x.post.getDay()] + " " + dd(x.post) }) : "",
      x.st.done ? h("span", { class: "post", text: " \u00B7 em " + listName(x.card.idList) }) : ""
    ]),
    h("span", { class: "acts" }, [pill, mv])
  ]);
}

/* ---------- menu de status ---------- */
var MENU = null;
function closeMenu() { if (MENU) { MENU.remove(); MENU = null; } }
document.addEventListener("mousedown", function (e) { if (MENU && !MENU.contains(e.target) && e.target !== MENU._owner) closeMenu(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
function openMenu(btn, x) {
  closeMenu();
  var f = x.st.field, cur, opts;
  if (f) {
    cur = x.st.opt ? x.st.opt.id : "";
    opts = [{ id: "", text: "—" }].concat((f.options || []).map(function (o) { return { id: o.id, text: optText(o), o: o }; }));
  } else {
    /* etapa sem campo de status: só marca ou desmarca o item do checklist */
    cur = x.item.state === "complete" ? "complete" : "incomplete";
    opts = [{ id: "incomplete", text: "A fazer" }, { id: "complete", text: "Feito", o: { color: "green" } }];
  }
  var menu = h("div", { class: "menu", role: "listbox" });
  opts.forEach(function (op) {
    var c = col(op.o && op.o.color);
    var b = h("button", { role: "option" }, [h("span", { class: "chip", style: op.o ? "background:" + c[0] + ";color:" + c[1] : "background:#f1f2f4;color:#8590a2", text: op.text }), op.id === cur ? h("span", { text: "✓", style: "color:#0c66e4" }) : ""]);
    b.addEventListener("click", function () { closeMenu(); if (op.id !== cur) { if (f) setStatus(x, f, op.id); else setDone(x, op.id); } });
    menu.append(b);
  });
  document.body.append(menu); MENU = menu; menu._owner = btn;
  var r = btn.getBoundingClientRect(), mh = menu.offsetHeight;
  var top = r.bottom + 4; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
}
/* muda o campo de status e, quando conclui, marca o item do checklist como feito */
async function setStatus(x, f, idValue) {
  var card = x.card;
  try {
    var base = "https://api.trello.com/1/cards/" + card.id;
    var q = "?key=" + APP_KEY + "&token=" + S.token;
    var res = await fetch(base + "/customField/" + f.id + "/item" + q, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(idValue ? { idValue: idValue } : { idValue: "", value: "" }) });
    if (!res.ok) throw new Error(res.status);
    card.customFieldItems = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
    if (idValue) card.customFieldItems.push({ idCustomField: f.id, idValue: idValue });
    var o = (f.options || []).find(function (op) { return op.id === idValue; });
    var tx = optText(o), isR = /roteir/i.test(f.name);
    /* no roteiro, Revisar já quer dizer roteiro entregue */
    var finished = /conclu|publicad/i.test(tx) || (isR && /revisar|corre/i.test(tx));
    var want = finished ? "complete" : "incomplete";
    if (x.item.state !== want) {
      var r2 = await fetch(base + "/checkItem/" + x.item.id + q, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ state: want }) });
      if (r2.ok) x.item.state = want;
    }
    if (isR) {
      /* roteiro Concluído = revisão do roteiro feita; Revisar = revisão ainda a fazer */
      var rv = cardItems(card).find(function (i) { return RRV.test(i.name.trim()); });
      var rw = /conclu/i.test(tx) ? "complete" : "incomplete";
      if (rv && rv.state !== rw) {
        var r3 = await fetch(base + "/checkItem/" + rv.id + q, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ state: rw }) });
        if (r3.ok) rv.state = rw;
      }
    }
    render();
  } catch (e) { var n = document.getElementById("msg"); if (n) { n.textContent = "Não salvou (" + e.message + ")."; n.className = "note err"; } }
}
async function setDone(x, state) {
  try {
    var res = await fetch("https://api.trello.com/1/cards/" + x.card.id + "/checkItem/" + x.item.id + "?key=" + APP_KEY + "&token=" + S.token, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ state: state }) });
    if (!res.ok) throw new Error(res.status);
    x.item.state = state;
    if (RRV.test(x.item.name.trim())) await reconcile();
    render();
  } catch (e) { var n = document.getElementById("msg"); if (n) { n.textContent = "Não salvou (" + e.message + ")."; n.className = "note err"; } }
}

load();
