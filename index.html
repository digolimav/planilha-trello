<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planilha Projeto Curioso</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root{--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--bg:#fff;--soft:#f4f5f7;--accent:#0c66e4}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{padding:16px 20px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.bar input{min-width:220px}
.bar .sp{flex:1}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--muted);font-size:13px}
.err{color:#ae2e24}
.counts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:13px;color:var(--muted)}
.counts b{color:var(--ink);font-weight:600}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{position:sticky;top:0;z-index:1;background:#5b3a8c;color:#fff;text-align:left;font-weight:600;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none}
th.nosort{cursor:default}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--soft)}
td.name{min-width:260px;max-width:380px}
td.name a{color:var(--ink);text-decoration:none;font-weight:500}
td.name a:hover{text-decoration:underline}
.grp td{background:var(--soft);font-weight:600;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.lab{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;margin:1px 4px 1px 0;white-space:nowrap}
.late{color:#ae2e24;font-weight:600}
select.st{appearance:none;-webkit-appearance:none;width:100%;min-width:120px;font:inherit;font-size:13px;padding:5px 24px 5px 10px;border-radius:999px;border:0;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select.st:disabled{cursor:default;opacity:.85}
select.saving{opacity:.5}
</style>
</head>
<body>
<div id="app"><p class="note">Carregando…</p></div>
<script>
/* Configuração: a chave da API vem do painel de admin de Power-Ups do Trello (pode ficar pública). */
var APP_KEY = "";
var APP_NAME = "Planilha Projeto Curioso";
var ICON = "";

var VIEW = new URLSearchParams(location.search).get("view");

/* ---------- conector (sem ?view): só registra o botão no quadro ---------- */
if (VIEW !== "table") {
  document.getElementById("app").innerHTML = "";
  var base = location.href.split("?")[0];
  ICON = base.replace(/index\.html$/, "").replace(/\/?$/, "/") + "icon.svg";
  TrelloPowerUp.initialize({
    "board-buttons": function () {
      return [{
        icon: { dark: ICON, light: ICON },
        text: "Planilha",
        callback: function (t) {
          return t.modal({ url: base + "?view=table", fullscreen: true, title: "Planilha" });
        }
      }];
    }
  }, APP_KEY ? { appKey: APP_KEY, appName: APP_NAME } : {});
} else {
  startTable();
}

/* ---------- tabela ---------- */
function startTable() {
  var t = TrelloPowerUp.iframe(APP_KEY ? { appKey: APP_KEY, appName: APP_NAME } : {});
  var COLORS = {
    green: ["#baf3db", "#164b35"], yellow: ["#f8e6a0", "#533f04"], orange: ["#fedec8", "#702e00"],
    red: ["#ffd5d2", "#5d1f1a"], purple: ["#dfd8fd", "#352c63"], blue: ["#cce0ff", "#09326c"],
    sky: ["#c6edfb", "#164555"], lime: ["#d3f1a7", "#37471f"], pink: ["#fdd0ec", "#50253f"],
    black: ["#44546f", "#ffffff"], none: ["#f1f2f4", "#44546f"]
  };
  function col(c) { if (!c) return COLORS.none; var b = c.replace(/_(light|dark)$/, ""); return COLORS[b] || COLORS.none; }
  var S = { board: null, lists: [], cards: [], fields: [], q: "", label: "", list: "", sort: "due", dir: 1, group: true, token: null };
  var app = document.getElementById("app");
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === "text") el.textContent = attrs[k];
      else if (k === "style") el.setAttribute("style", attrs[k]);
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
    return el;
  }

  async function load() {
    try {
      var r = await Promise.all([
        t.board("id", "name", "labels", "customFields"),
        t.lists("id", "name"),
        t.cards("id", "name", "due", "dueComplete", "labels", "idList", "url", "pos", "customFieldItems")
      ]);
      S.board = r[0]; S.lists = r[1]; S.cards = r[2];
      S.fields = (S.board.customFields || []).filter(function (f) { return f.type === "list"; })
        .sort(function (a, b) { return (a.pos || 0) - (b.pos || 0); });
      try { if (APP_KEY && await t.getRestApi().isAuthorized()) S.token = await t.getRestApi().getToken(); } catch (e) {}
      render();
    } catch (e) {
      app.replaceChildren(h("p", { class: "err", text: "Não foi possível ler o quadro: " + (e && e.message || e) }));
    }
  }

  function valueOf(card, f) {
    var it = (card.customFieldItems || []).find(function (i) { return i.idCustomField === f.id; });
    return it ? it.idValue : "";
  }
  function optOf(f, id) { return (f.options || []).find(function (o) { return o.id === id; }); }
  function optText(o) { return o ? (o.value && o.value.text) || "" : ""; }
  function listName(id) { var l = S.lists.find(function (x) { return x.id === id; }); return l ? l.name : ""; }
  function fmtDate(d) { if (!d) return ""; var x = new Date(d); return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0"); }

  async function authorize() {
    if (!APP_KEY) { alertBox("Falta configurar a chave da API do Power-Up."); return false; }
    try {
      await t.getRestApi().authorize({ scope: "read,write", expiration: "never" });
      S.token = await t.getRestApi().getToken();
      render();
      return true;
    } catch (e) { alertBox("Autorização cancelada."); return false; }
  }
  function alertBox(msg) { var n = document.getElementById("msg"); if (n) { n.textContent = msg; n.className = "note err"; } }

  async function setValue(card, f, idValue, sel) {
    if (!S.token && !(await authorize())) { render(); return; }
    sel.classList.add("saving"); sel.disabled = true;
    var url = "https://api.trello.com/1/cards/" + card.id + "/customField/" + f.id + "/item?key=" + APP_KEY + "&token=" + S.token;
    var body = idValue ? { idValue: idValue } : { idValue: "", value: "" };
    try {
      var res = await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(res.status);
      var items = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
      if (idValue) items.push({ idCustomField: f.id, idValue: idValue });
      card.customFieldItems = items;
      render();
    } catch (e) {
      if (String(e.message) === "401") { S.token = null; }
      alertBox("Não salvou (" + e.message + "). Tente de novo.");
      sel.classList.remove("saving"); sel.disabled = false;
    }
  }

  function statusSelect(card, f) {
    var cur = valueOf(card, f), o = optOf(f, cur), c = col(o && o.color);
    var sel = h("select", { class: "st", style: o ? "background-color:" + c[0] + ";color:" + c[1] : "background-color:#f1f2f4;color:#8590a2", "aria-label": f.name + " de " + card.name });
    sel.append(h("option", { value: "", text: "—" }));
    (f.options || []).forEach(function (op) { var e = h("option", { value: op.id, text: optText(op) }); if (op.id === cur) e.selected = true; sel.append(e); });
    sel.addEventListener("change", function () { setValue(card, f, sel.value, sel); });
    return sel;
  }

  function visibleCards() {
    var q = S.q.trim().toLowerCase();
    var out = S.cards.filter(function (c) {
      if (q && c.name.toLowerCase().indexOf(q) < 0) return false;
      if (S.label && !(c.labels || []).some(function (l) { return l.id === S.label; })) return false;
      if (S.list && c.idList !== S.list) return false;
      return true;
    });
    var key = S.sort;
    out.sort(function (a, b) {
      var va, vb;
      if (key === "due") { va = a.due || "9999"; vb = b.due || "9999"; }
      else if (key === "name") { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
      else if (key === "label") { va = ((a.labels || [])[0] || {}).name || "~"; vb = ((b.labels || [])[0] || {}).name || "~"; }
      else { var f = S.fields.find(function (x) { return x.id === key; }); va = optText(optOf(f, valueOf(a, f))) || "~"; vb = optText(optOf(f, valueOf(b, f))) || "~"; }
      return va < vb ? -S.dir : va > vb ? S.dir : 0;
    });
    return out;
  }

  function render() {
    var cards = visibleCards();
    var labels = (S.board.labels || []).filter(function (l) { return l.name; });
    var bar = h("div", { class: "bar" }, [
      h("input", { type: "search", placeholder: "Buscar vídeo", value: S.q, oninput: function (e) { S.q = e.target.value; renderTable(); } }),
      (function () { var s = h("select", { "aria-label": "Projeto", onchange: function (e) { S.label = e.target.value; renderTable(); } }); s.append(h("option", { value: "", text: "Todos os projetos" })); labels.forEach(function (l) { var o = h("option", { value: l.id, text: l.name }); if (l.id === S.label) o.selected = true; s.append(o); }); return s; })(),
      (function () { var s = h("select", { "aria-label": "Lista", onchange: function (e) { S.list = e.target.value; renderTable(); } }); s.append(h("option", { value: "", text: "Todas as listas" })); S.lists.forEach(function (l) { var o = h("option", { value: l.id, text: l.name }); if (l.id === S.list) o.selected = true; s.append(o); }); return s; })(),
      h("label", { class: "note" }, [(function () { var c = h("input", { type: "checkbox", onchange: function (e) { S.group = e.target.checked; renderTable(); } }); c.checked = S.group; return c; })(), " Agrupar por lista"]),
      h("span", { class: "sp" }),
      S.token || !APP_KEY ? null : h("button", { class: "primary", text: "Autorizar edição", onclick: authorize }),
      h("button", { text: "Atualizar", onclick: load })
    ]);
    app.replaceChildren(bar, h("p", { id: "msg", class: "note", text: S.fields.length ? "" : "Este quadro ainda não tem campos personalizados do tipo lista." }), h("div", { id: "counts", class: "counts" }), h("div", { id: "tbl", class: "wrap" }));
    renderTable(cards);
  }

  function renderTable(cards) {
    cards = cards || visibleCards();
    var now = Date.now();
    /* contagem por etapa: quantos não estão concluídos */
    var counts = document.getElementById("counts"); counts.replaceChildren(h("span", {}, [h("b", { text: String(cards.length) }), " vídeos"]));
    S.fields.forEach(function (f) {
      var pend = cards.filter(function (c) { var t2 = optText(optOf(f, valueOf(c, f))).toLowerCase(); return t2 && t2.indexOf("conclu") < 0; }).length;
      counts.append(h("span", {}, [f.name + ": ", h("b", { text: String(pend) }), " em aberto"]));
    });
    var heads = [["name", "Vídeo"], ["label", "Projeto"], ["due", "Data"]].concat(S.fields.map(function (f) { return [f.id, f.name]; }));
    var trh = h("tr");
    heads.forEach(function (hd) {
      var arrow = S.sort === hd[0] ? (S.dir > 0 ? " ▲" : " ▼") : "";
      trh.append(h("th", { text: hd[1] + arrow, onclick: function () { if (S.sort === hd[0]) S.dir = -S.dir; else { S.sort = hd[0]; S.dir = 1; } renderTable(); } }));
    });
    var tb = h("tbody");
    var groups = S.group ? S.lists.map(function (l) { return { name: l.name, cards: cards.filter(function (c) { return c.idList === l.id; }) }; }) : [{ name: null, cards: cards }];
    groups.forEach(function (g) {
      if (!g.cards.length) return;
      if (g.name != null) tb.append(h("tr", { class: "grp" }, [h("td", { colspan: heads.length, text: g.name + " · " + g.cards.length })]));
      g.cards.forEach(function (c) {
        var late = c.due && !c.dueComplete && new Date(c.due).getTime() < now;
        var tr = h("tr", {}, [
          h("td", { class: "name" }, [h("a", { href: c.url, text: c.name, onclick: function (e) { e.preventDefault(); t.showCard(c.id); } })]),
          h("td", {}, (c.labels || []).map(function (l) { var cc = col(l.color); return h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: l.name || " " }); })),
          h("td", { class: late ? "late" : null, text: fmtDate(c.due) + (late ? " · atrasado" : "") })
        ]);
        S.fields.forEach(function (f) { tr.append(h("td", {}, [statusSelect(c, f)])); });
        tb.append(tr);
      });
    });
    if (!tb.children.length) tb.append(h("tr", {}, [h("td", { colspan: heads.length, class: "note", text: "Nenhum vídeo com esses filtros." })]));
    document.getElementById("tbl").replaceChildren(h("table", {}, [h("thead", {}, [trh]), tb]));
  }

  load();
}
</script>
</body>
</html>
