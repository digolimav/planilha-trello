<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronograma Projeto Curioso</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root{--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--bg:#fff;--soft:#f4f5f7;--accent:#0c66e4;--late:#ae2e24}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{padding:16px 20px 40px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.week{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.week button{padding:4px 10px}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chips button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 10px}
.chips button:last-child{border-right:0}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{color:var(--muted);font-size:13px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.wk{margin:0 0 18px}
.wk h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:46px;min-width:0}
.hd{background:#5b3a8c;color:#fff;font-weight:600;font-size:12.5px;text-align:center;min-height:0!important;padding:7px 4px!important}
.hd.today{background:#3d2575}
.ch{display:flex;flex-direction:column;justify-content:center;gap:3px;background:var(--soft)}
.lab{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cnt{font-size:12px;color:var(--muted)}
.cnt.gap{color:var(--late);font-weight:600}
.cell.past{background:#fbfbfc}
.cell.today{background:#f3f0ff}
.it{display:flex;align-items:flex-start;gap:6px;width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin:0 0 4px;background:#fff;font-size:12px;line-height:1.3;cursor:pointer}
.it:hover{border-color:#8590a2}
.it .dot{margin-top:3px}
.it.ext{border-style:dashed;color:var(--muted);font-style:italic;background:transparent}
.it.done{opacity:.55}
.it span.t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sum{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sum b{color:var(--ink)}
.metas{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px;background:#fff}
.metas .row{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px}
.metas label{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.metas input[type=time]{font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--line);border-radius:6px}
.metas .ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed var(--line)}
.metas .ln:first-of-type{border-top:0}
.metas .ln .lab{width:130px}
.dz{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dz button{border:0;border-right:1px solid var(--line);border-radius:0;padding:3px 8px;font-size:12px;background:#fff}
.dz button:last-child{border-right:0}
.dz button[aria-pressed="true"]{background:#5b3a8c;color:#fff}
.slot{display:block;border:1.5px dashed #e34935;color:#ae2e24;background:#fff5f4;border-radius:6px;padding:4px 6px;font-size:12px;font-weight:600;margin:0 0 4px}
.slot.past{border-color:#c1c7d0;color:#8590a2;background:transparent;font-weight:400}
.hr{font-size:10.5px;font-weight:600;color:var(--muted);margin-left:auto;white-space:nowrap;padding-left:4px}
</style>
</head>
<body>
<div id="app"><p class="note">Carregando…</p></div>
<script>
/* Cronograma: grade da semana (canais x dias) com o que posta em cada dia e a situação de cada vídeo. */
var APP_KEY = "d7dce7c9a2c664af9701e49ee088a979";
var APP_NAME = "Planilha Projeto Curioso";
var BRAIN = "6ad78bf2e6a07b19369b36e6";
var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: APP_NAME });
var app = document.getElementById("app");
var COLORS = {
  green: ["#4bce97", "#0d2e20"], yellow: ["#f5cd47", "#3d2e00"], orange: ["#fea362", "#4a1f00"],
  red: ["#f87168", "#4a120d"], purple: ["#9f8fef", "#231c47"], blue: ["#579dff", "#06224a"],
  sky: ["#6cc3e0", "#0e3240"], lime: ["#94c748", "#25330f"], pink: ["#e774bb", "#40122f"],
  black: ["#44546f", "#ffffff"], none: ["#f1f2f4", "#44546f"]
};
var ST = {
  posted: { c: "#8590a2", n: "Postado" },
  ready: { c: "#22a06b", n: "Pronto (edição concluída)" },
  going: { c: "#e2b203", n: "Em andamento" },
  late: { c: "#e34935", n: "Atrasado ou travado" },
  ext: { c: "#c1c7d0", n: "No Brainstorm (ainda não enviado)" }
};
var DIAS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
function col(c) { if (!c) return COLORS.none; var b = c.replace(/_(light|dark)$/, ""); return COLORS[b] || COLORS.none; }
function h(tag, attrs, kids) {
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === "text") el.textContent = attrs[k];
    else if (k === "style") el.setAttribute("style", attrs[k]);
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c != null && c !== "") el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function day(x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()); }
function monday(x) { var d = day(x); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function addDays(x, n) { var d = new Date(x); d.setDate(d.getDate() + n); return d; }
function dd(x) { return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0"); }
function short(name) { return name.replace(/^(ESP\s*-\s*)?(ROBOT|CELEBS|DUNKER|RIGHT TURN|MYSTERY|COMP|COMPILADO)\s*-\s*/i, function (m, esp) { return esp ? "ESP · " : ""; }); }

var S = { week: 0, n: 1, grade: {}, showMetas: false, token: null, ext: [] };
/* cronograma fixo de cada canal (dias 0=Seg ... 6=Dom); vale até alguém mudar em "Cronograma dos canais" */
var PADRAO = [
  [/celebs/i, [3, 6], "12:00"],
  [/not a robot|^inar/i, [3, 6], "12:00"],
  [/no soy/i, [2, 6], "15:00"],
  [/dunker/i, [5], ""],
  [/robot man|robot-man/i, [2, 5], "12:00"]
];
function gradeOf(l) {
  if (S.grade[l.id]) return S.grade[l.id];
  var p = PADRAO.find(function (x) { return x[0].test(l.name); });
  return p ? { d: p[1], h: p[2] } : { d: [], h: "" };
}

async function load() {
  try {
    var r = await Promise.all([
      t.board("id", "labels", "customFields"),
      t.lists("id", "name"),
      t.cards("id", "name", "labels", "idList", "url", "customFieldItems", "dueComplete"),
      t.get("board", "shared", "grade"),
      t.get("board", "private", "cronograma")
    ]);
    S.board = r[0]; S.lists = r[1]; S.cards = r[2]; S.grade = r[3] || {};
    var p = r[4] || {}; if (!S.loaded) { S.n = p.n || 1; S.loaded = true; }
    var cfs = S.board.customFields || [];
    S.post = cfs.find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
    S.edit = cfs.find(function (f) { return f.type === "list" && /edi[cç]/i.test(f.name); });
    S.pub = cfs.find(function (f) { return f.type === "list" && /publica/i.test(f.name); });
    try { if (await t.getRestApi().isAuthorized()) S.token = await t.getRestApi().getToken(); } catch (e) {}
    await loadBrainstorm();
    render();
  } catch (e) { app.replaceChildren(h("p", { class: "note", style: "color:#ae2e24", text: "Não foi possível ler o quadro: " + (e && e.message || e) })); }
}
async function loadBrainstorm() {
  S.ext = [];
  if (!S.token || S.board.id === BRAIN) return;
  try {
    var q = "?key=" + APP_KEY + "&token=" + S.token;
    var r = await Promise.all([
      fetch("https://api.trello.com/1/boards/" + BRAIN + "/customFields" + q).then(function (x) { return x.json(); }),
      fetch("https://api.trello.com/1/boards/" + BRAIN + "/lists" + q + "&fields=name").then(function (x) { return x.json(); }),
      fetch("https://api.trello.com/1/boards/" + BRAIN + "/cards" + q + "&fields=name,labels,idList,url&customFieldItems=true").then(function (x) { return x.json(); })
    ]);
    var pf = r[0].find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
    if (!pf) return;
    r[2].forEach(function (c) {
      if (/^TEMPLATE/i.test(c.name)) return;
      var l = r[1].find(function (x) { return x.id === c.idList; });
      if (l && /descart/i.test(l.name)) return;
      var it = (c.customFieldItems || []).find(function (i) { return i.idCustomField === pf.id; });
      if (it && it.value && it.value.date) S.ext.push({ id: c.id, name: c.name, labels: c.labels || [], url: c.url, ext: true, date: day(new Date(it.value.date)) });
    });
  } catch (e) {}
}
function fieldText(c, f) {
  if (!f) return "";
  var it = (c.customFieldItems || []).find(function (i) { return i.idCustomField === f.id; });
  var o = it && (f.options || []).find(function (x) { return x.id === it.idValue; });
  return o ? (o.value && o.value.text) || "" : "";
}
function postDate(c) {
  if (c.ext) return c.date;
  var it = S.post && (c.customFieldItems || []).find(function (i) { return i.idCustomField === S.post.id; });
  return it && it.value && it.value.date ? day(new Date(it.value.date)) : null;
}
function listName(id) { var l = S.lists.find(function (x) { return x.id === id; }); return l ? l.name : ""; }
function status(c) {
  if (c.ext) return "ext";
  var ln = listName(c.idList);
  if (c.dueComplete || /postado/i.test(ln) || /publicad/i.test(fieldText(c, S.pub))) return "posted";
  if ((c.labels || []).some(function (l) { return /travado/i.test(l.name || ""); })) return "late";
  if (postDate(c) < day(new Date())) return "late";
  if (/aprovad/i.test(ln) || /conclu/i.test(fieldText(c, S.edit))) return "ready";
  return "going";
}
/* canais = etiquetas com nome (fora TRAVADO); o tema sem etiqueta cai em "Sem canal" */
function channels() { return (S.board.labels || []).filter(function (l) { return l.name && !/travado/i.test(l.name); }); }
function chanOf(c) {
  var names = channels().map(function (l) { return l.name; });
  var l = (c.labels || []).find(function (x) { return names.indexOf(x.name) >= 0; });
  return l ? l.name : "_";
}

function render() {
  var W0 = addDays(monday(new Date()), S.week * 7);
  var label = S.week === 0 ? "Esta semana" : S.week === 1 ? "Próxima semana" : S.week === -1 ? "Semana passada" : "A partir de " + dd(W0);
  var modes = h("div", { class: "chips", role: "group", "aria-label": "Quantas semanas" });
  [[1, "1 semana"], [4, "4 semanas"]].forEach(function (m) {
    modes.append(h("button", { "aria-pressed": S.n === m[0] ? "true" : "false", text: m[1], onclick: function () { S.n = m[0]; try { t.set("board", "private", "cronograma", { n: S.n }); } catch (e) {} render(); } }));
  });
  var bar = h("div", { class: "bar" }, [
    h("span", { class: "week" }, [
      h("button", { "aria-label": "Semana anterior", text: "‹", onclick: function () { S.week--; render(); } }),
      h("span", { text: label }),
      h("button", { "aria-label": "Próxima semana", text: "›", onclick: function () { S.week++; render(); } })
    ]),
    S.week !== 0 ? h("button", { text: "Hoje", onclick: function () { S.week = 0; render(); } }) : null,
    modes,
    h("span", { class: "sp" }),
    h("button", { text: S.showMetas ? "Fechar" : "Cronograma dos canais", onclick: function () { S.showMetas = !S.showMetas; render(); } }),
    h("button", { text: "Atualizar", onclick: load })
  ]);
  var legend = h("div", { class: "legend" }, Object.keys(ST).map(function (k) {
    return h("span", {}, [h("i", { class: "dot", style: k === "ext" ? "border:1.5px dashed #8590a2;background:transparent" : "background:" + ST[k].c }), ST[k].n]);
  }).concat([h("span", {}, [h("i", { class: "dot", style: "border:1.5px dashed #e34935;background:#fff5f4;border-radius:3px" }), "Dia do cronograma sem vídeo"])]));
  var out = [bar];
  if (S.showMetas) out.push(metasBox());
  out.push(legend);
  if (!S.token) out.push(h("p", { class: "note", style: "margin:0 0 10px", text: "Para ver também os temas agendados no Brainstorm, abra a Planilha e clique em \"Autorizar edição\" uma vez." }));
  for (var i = 0; i < S.n; i++) out.push(weekGrid(addDays(W0, i * 7)));
  app.replaceChildren.apply(app, out);
}

function weekGrid(W0) {
  var W1 = addDays(W0, 7), today = day(new Date());
  var items = S.cards.concat(S.ext).filter(function (c) { var d = postDate(c); return d && d >= W0 && d < W1; });
  var chans = channels().map(function (l) { return l.name; });
  if (items.some(function (c) { return chanOf(c) === "_"; })) chans.push("_");
  var labByName = {}; (S.board.labels || []).forEach(function (l) { labByName[l.name] = l; });
  var grid = h("div", { class: "grid", style: "grid-template-columns:150px repeat(7, minmax(0,1fr))" });
  grid.append(h("div", { class: "hd", text: "Canal" }));
  for (var d = 0; d < 7; d++) { var dt = addDays(W0, d); grid.append(h("div", { class: "hd" + (+dt === +today ? " today" : ""), text: DIAS[d] + " " + dd(dt) })); }
  var gaps = 0, total = 0;
  chans.forEach(function (name) {
    var mine = items.filter(function (c) { return chanOf(c) === name; });
    var lab = labByName[name], cc = col(lab && lab.color);
    var g = lab ? gradeOf(lab) : { d: [], h: "" };
    var plan = mine.length;
    total += plan;
    if (!g.d.length && !plan) return; /* canal sem vídeo e sem cronograma não ocupa linha */
    var faltam = g.d.filter(function (dIdx) { var dt = addDays(W0, dIdx); return dt >= today && !mine.some(function (c) { return +postDate(c) === +dt; }); }).length;
    gaps += faltam;
    var cobertos = g.d.filter(function (dIdx) { var dt = addDays(W0, dIdx); return mine.some(function (c) { return +postDate(c) === +dt; }); }).length;
    var fora = mine.filter(function (c) { return g.d.indexOf((postDate(c).getDay() + 6) % 7) < 0; }).length;
    grid.append(h("div", { class: "ch" }, [
      name === "_" ? h("span", { class: "lab", style: "background:#f1f2f4;color:#44546f", text: "Sem canal" }) : h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: name }),
      h("span", { class: "cnt" + (faltam ? " gap" : ""), text: g.d.length ? cobertos + "/" + g.d.length + " dias" + (fora ? " + " + fora + " fora do dia" : "") + (faltam ? " · falta " + faltam : "") : plan + " na semana" })
    ]));
    for (var d2 = 0; d2 < 7; d2++) {
      var dt2 = addDays(W0, d2);
      var cell = h("div", { class: "cell" + (+dt2 === +today ? " today" : dt2 < today ? " past" : "") });
      var inDay = mine.filter(function (c) { return +postDate(c) === +dt2; });
      var isSlot = g.d.indexOf(d2) >= 0;
      if (isSlot && !inDay.length) cell.append(h("span", { class: "slot" + (dt2 < today ? " past" : ""), text: (dt2 < today ? "Sem vídeo" : "Falta vídeo") + (g.h ? " · " + g.h : "") }));
      inDay.forEach(function (c) {
        var st = status(c);
        var b = h("button", { class: "it" + (c.ext ? " ext" : "") + (st === "posted" ? " done" : ""), title: c.name + (c.ext ? " (no Brainstorm)" : " — " + listName(c.idList)) }, [
          h("i", { class: "dot", style: c.ext ? "border:1.5px dashed #8590a2;background:transparent" : "background:" + ST[st].c }),
          h("span", { class: "t", text: short(c.name) }),
          isSlot && g.h ? h("span", { class: "hr", text: g.h }) : ""
        ]);
        b.addEventListener("click", function () { if (c.ext) window.open(c.url, "_blank"); else t.showCard(c.id); });
        cell.append(b);
      });
      grid.append(cell);
    }
  });
  var late = items.filter(function (c) { return status(c) === "late"; }).length;
  var ext = items.filter(function (c) { return c.ext; }).length;
  return h("section", { class: "wk" }, [
    h("h3", { text: "Semana " + dd(W0) + " a " + dd(addDays(W0, 6)) }),
    grid,
    h("p", { class: "sum" }, [h("b", { text: String(total) }), " vídeo" + (total === 1 ? "" : "s"),
      ext ? " (" + ext + " ainda no Brainstorm)" : "",
      late ? h("span", { style: "color:#ae2e24;font-weight:600", text: " · " + late + " atrasado" + (late > 1 ? "s" : "") }) : "",
      gaps ? h("span", { style: "color:#ae2e24;font-weight:600", text: " · " + gaps + " dia" + (gaps > 1 ? "s" : "") + " do cronograma sem vídeo" }) : ""])
  ]);
}

function metasBox() {
  var box = h("div", { class: "metas" }, [h("p", { class: "note", text: "Em que dias e horário cada canal posta. Dia do cronograma sem vídeo aparece em vermelho na grade." })]);
  channels().forEach(function (l) {
    var cc = col(l.color), g = gradeOf(l);
    var dz = h("div", { class: "dz", role: "group", "aria-label": "Dias de " + l.name });
    DIAS.forEach(function (nm, i) {
      dz.append(h("button", { "aria-pressed": g.d.indexOf(i) >= 0 ? "true" : "false", text: nm, onclick: function () {
        var d = g.d.indexOf(i) >= 0 ? g.d.filter(function (x) { return x !== i; }) : g.d.concat([i]).sort();
        saveGrade(l, { d: d, h: g.h });
      } }));
    });
    var tm = h("input", { type: "time", value: g.h || "", "aria-label": "Horário de " + l.name });
    tm.addEventListener("change", function () { saveGrade(l, { d: g.d, h: tm.value }); });
    box.append(h("div", { class: "ln" }, [h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: l.name }), dz, tm]));
  });
  return box;
}
async function saveGrade(l, g) {
  /* grava a grade inteira (inclusive o padrão dos outros canais) para todos verem o mesmo */
  var all = {};
  channels().forEach(function (x) { var v = x.id === l.id ? g : gradeOf(x); all[x.id] = { d: v.d, h: v.h }; });
  S.grade = all;
  try { await t.set("board", "shared", "grade", all); } catch (e) {}
  render();
}

load();
</script>
</body>
</html>
