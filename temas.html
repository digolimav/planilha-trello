<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temas Projeto Curioso</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root{--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--bg:#fff;--soft:#f4f5f7;--accent:#0c66e4}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{padding:16px 20px 40px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;min-width:220px}
.bar .sp{flex:1}
.note{color:var(--muted);font-size:13px;margin:0}
.err{color:#ae2e24}
.counts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:13px;color:var(--muted)}
.counts b{color:var(--ink)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{position:sticky;top:0;z-index:1;background:#5b3a8c;color:#fff;text-align:left;font-weight:600;padding:9px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--soft)}
td.name{min-width:280px;max-width:420px}
td.name a{color:var(--ink);text-decoration:none;font-weight:500}
td.name a:hover{text-decoration:underline}
td.why{color:var(--muted);font-size:12.5px;max-width:380px}
td.fit,th.fit{width:1%;white-space:nowrap}
.grp td{background:var(--soft);font-weight:600;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.lab{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
.links{font-variant-numeric:tabular-nums;font-size:13px}
.links.ok{color:#1f845a;font-weight:600}
.links.low{color:#a54800}
.links.none{color:#ae2e24}
.pill{display:inline-flex;align-items:center;gap:6px;min-width:96px;justify-content:space-between;font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:0;cursor:pointer;text-align:left}
.pill::after{content:"\25BE";font-size:10px;opacity:.7}
.dd{position:relative;display:inline-block}
.dd>button{min-width:160px;text-align:left}
.ddp{position:absolute;z-index:5;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(9,30,66,.18);padding:8px;min-width:220px;max-height:360px;overflow:auto}
.ddp label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}
.ddp label:hover{background:var(--soft)}
.ddp .row{display:flex;gap:6px;margin-bottom:6px}
.ddp .row button{padding:3px 8px;font-size:12px}
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(9,30,66,.2);padding:6px;min-width:170px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:4px 6px;border-radius:6px;text-align:left}
.menu button:hover{background:var(--soft)}
.menu .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px}
td.ck,th.ck{width:1%;padding-right:0}
td.ck input{width:16px;height:16px;cursor:pointer;margin-top:3px}
.sendbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;background:#e9f2ff;border:1px solid #85b8ff;border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:13px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(9,30,66,.45);display:flex;justify-content:center;align-items:flex-start;padding:24px;overflow:auto}
.panel{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(9,30,66,.35)}
.panel h2{margin:0 0 4px;font-size:17px}
.sc{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.sc .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--soft)}
.sc .hd b{flex:1;min-width:200px}
.sc table{min-width:0;font-size:13px}
.sc td{border-top:1px solid var(--line);padding:4px 12px;vertical-align:middle}
.sc select,.sc input[type=date]{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.sc .st{font-size:12px;color:var(--muted)}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px}
.sc.bulk{border-color:#85b8ff}
.sc.bulk .hd{background:#e9f2ff}
</style>
</head>
<body>
<div id="app"><p class="note">Carregando…</p></div>
<script>
/* Visão de planilha do quadro de temas: por projeto (etiqueta), com etapa, potencial, quantidade de links e o porquê. */
var APP_KEY = "d7dce7c9a2c664af9701e49ee088a979";
var APP_NAME = "Planilha Projeto Curioso";
var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: APP_NAME });
var app = document.getElementById("app");
var COLORS = {
  green: ["#4bce97", "#0d2e20"], yellow: ["#f5cd47", "#3d2e00"], orange: ["#fea362", "#4a1f00"],
  red: ["#f87168", "#4a120d"], purple: ["#9f8fef", "#231c47"], blue: ["#579dff", "#06224a"],
  sky: ["#6cc3e0", "#0e3240"], lime: ["#94c748", "#25330f"], pink: ["#e774bb", "#40122f"],
  black: ["#44546f", "#ffffff"], none: ["#f1f2f4", "#44546f"]
};
var STAGE = ["#dfe1e6", "#f8e6a0", "#baf3db", "#cce0ff", "#f1f2f4"];
function col(c) { if (!c) return COLORS.none; var b = c.replace(/_(light|dark)$/, ""); return COLORS[b] || COLORS.none; }
function h(tag, attrs, kids) {
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === "text") el.textContent = attrs[k];
    else if (k === "style") el.setAttribute("style", attrs[k]);
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c != null && c !== "") el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
var S = { q: "", labels: [], lists: null, open: "", token: null, sel: {} };
/* para onde vai o tema aprovado */
var PROD = { board: "6a74fccc3cd73e432b92cda8", list: /ESCREVENDO/i };
var TPL_CHECKLIST = "6ad69a8e90a4f4636a5c41a4";
/* prazo de cada etapa em dias antes da postagem (null = hoje) */
/* no envio só se define quem faz o roteiro (produção, revisão e tradução); o resto se ajusta depois, na produção */
var NO_ENVIO = /rotei|tradu/i;
var OFFSETS = [[/^tema/i, null], [/brainstorm/i, -3], [/revis.*rotei/i, -3], [/tradu/i, -3], [/rotei/i, -4], [/thumb/i, -1], [/revis/i, -1], [/edi[cç]|montagem/i, -1], [/metadado/i, -1], [/postag|publica/i, 0], [/./, -1]];

async function load() {
  try {
    var r = await Promise.all([
      t.board("id", "labels", "customFields"),
      t.lists("id", "name"),
      t.cards("id", "name", "desc", "labels", "idList", "url", "pos", "badges", "customFieldItems"),
      t.get("board", "private", "temas")
    ]);
    S.board = r[0]; S.listsAll = r[1]; S.cards = r[2];
    var p = r[3] || {};
    if (!S.loaded) { S.labels = p.labels || []; S.lists = p.lists || S.listsAll.filter(function (l) { return !/descart/i.test(l.name); }).map(function (l) { return l.id; }); S.loaded = true; }
    S.pot = (S.board.customFields || []).find(function (f) { return f.type === "list" && /potencial/i.test(f.name); });
    S.whyF = (S.board.customFields || []).find(function (f) { return f.type === "text" && /por qu/i.test(f.name); });
    try { if (await t.getRestApi().isAuthorized()) S.token = await t.getRestApi().getToken(); } catch (e) {}
    render();
  } catch (e) { app.replaceChildren(h("p", { class: "err", text: "Não foi possível ler o quadro: " + (e && e.message || e) })); }
}
function savePrefs() { try { t.set("board", "private", "temas", { labels: S.labels, lists: S.lists }); } catch (e) {} }
async function authorize() {
  try { await t.getRestApi().authorize({ scope: "read,write", expiration: "never" }); S.token = await t.getRestApi().getToken(); render(); return true; }
  catch (e) { msg("Autorização cancelada."); return false; }
}
function msg(x) { var n = document.getElementById("msg"); if (n) { n.textContent = x; n.className = "note err"; } }
async function api(method, path, body) {
  var res = await fetch("https://api.trello.com/1" + path + "?key=" + APP_KEY + "&token=" + S.token, { method: method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error(res.status);
}
function potOf(c) {
  if (!S.pot) return null;
  var it = (c.customFieldItems || []).find(function (i) { return i.idCustomField === S.pot.id; });
  return it ? (S.pot.options || []).find(function (o) { return o.id === it.idValue; }) : null;
}
function stars(c) { var o = potOf(c); return o ? (o.value.text.match(/⭐/g) || []).length : 0; }
function listIdx(id) { return S.listsAll.findIndex(function (l) { return l.id === id; }); }
/* "Por quê": a seção "Por quê / Potencial" da descrição; descrição fora do modelo aparece inteira */
function whyOf(c) {
  if (S.whyF) { var fi = (c.customFieldItems || []).find(function (i) { return i.idCustomField === S.whyF.id; }); if (fi && fi.value && fi.value.text) return fi.value.text.replace(/\s+/g, " ").trim(); }
  var d = c.desc || "";
  var m = d.match(/Por qu[eê][^\n]*\n([\s\S]*?)(\n#|$)/i);
  var txt = m ? m[1] : (/^\s*#/.test(d) ? "" : d);
  return txt.replace(/https?:\/\/\S+/g, "").replace(/[*#\u200c]/g, "").replace(/\s+/g, " ").trim();
}
/* links de referência: anexos ou links escritos na descrição (o que for maior) */
function linkCount(c) {
  var att = (c.badges && c.badges.attachments) || 0;
  var inDesc = ((c.desc || "").match(/https?:\/\/\S+/g) || []).filter(function (u) { return !/drive\.google|docs\.google/.test(u); });
  var uniq = inDesc.filter(function (u, i) { return inDesc.indexOf(u) === i; }).length;
  return Math.max(att, uniq);
}
function project(c) { var l = (c.labels || []).find(function (x) { return x.name; }); return l || null; }

function multiPicker(key, items, getSel, setSel, allTxt, manyTxt, chip) {
  var sel = getSel();
  var names = items.filter(function (l) { return sel.indexOf(l.id) >= 0; }).map(function (l) { return l.name; });
  var txt = !names.length || names.length === items.length ? allTxt : names.length === 1 ? names[0] : manyTxt + names.length;
  var wrap = h("div", { class: "dd" });
  wrap.append(h("button", { text: txt + " ▾", onclick: function () { S.open = S.open === key ? "" : key; render(); } }));
  if (S.open === key) {
    var panel = h("div", { class: "ddp" }, [h("div", { class: "row" }, [
      h("button", { text: "Todos", onclick: function () { setSel(key === "lists" ? items.map(function (l) { return l.id; }) : []); savePrefs(); render(); } }),
      h("button", { text: "Fechar", onclick: function () { S.open = ""; render(); } })
    ])]);
    items.forEach(function (l) {
      var cb = h("input", { type: "checkbox" }); cb.checked = sel.indexOf(l.id) >= 0;
      cb.addEventListener("change", function () { var s = getSel().filter(function (x) { return x !== l.id; }); if (cb.checked) s.push(l.id); setSel(s); savePrefs(); render(); });
      var cc = col(l.color);
      panel.append(h("label", {}, [cb, chip ? h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: l.name }) : h("span", { text: l.name })]));
    });
    wrap.append(panel);
  }
  return wrap;
}

function render() {
  var labels = (S.board.labels || []).filter(function (l) { return l.name; });
  var bar = h("div", { class: "bar" }, [
    h("input", { type: "search", placeholder: "Buscar tema", value: S.q, oninput: function (e) { S.q = e.target.value; renderTable(); } }),
    multiPicker("labels", labels, function () { return S.labels; }, function (v) { S.labels = v; }, "Projetos: todos", "Projetos: ", true),
    multiPicker("lists", S.listsAll, function () { return S.lists; }, function (v) { S.lists = v; }, "Etapas: todas", "Etapas: ", false),
    h("span", { class: "sp" }),
    S.token ? null : h("button", { class: "primary", text: "Autorizar edição", onclick: authorize }),
    h("button", { text: "Atualizar", onclick: load })
  ]);
  app.replaceChildren(bar, h("p", { id: "msg", class: "note" }), h("div", { id: "counts", class: "counts" }), h("div", { id: "tbl", class: "wrap" }));
  renderTable();
}

function renderTable() {
  var q = S.q.trim().toLowerCase();
  var cards = S.cards.filter(function (c) {
    if (/^TEMPLATE/i.test(c.name)) return false;
    if (q && (c.name + " " + c.desc).toLowerCase().indexOf(q) < 0) return false;
    if (S.labels.length && !(c.labels || []).some(function (l) { return S.labels.indexOf(l.id) >= 0; })) return false;
    return S.lists.indexOf(c.idList) >= 0;
  });
  /* agrupa por projeto (etiqueta); dentro, mais estrelas primeiro, depois a etapa mais avançada */
  var groups = {}, order = [];
  cards.forEach(function (c) { var p = project(c), k = p ? p.id : "_"; if (!groups[k]) { groups[k] = { lab: p, cards: [] }; order.push(k); } groups[k].cards.push(c); });
  var labOrder = (S.board.labels || []).map(function (l) { return l.id; });
  order.sort(function (a, b) { return (a === "_" ? 999 : labOrder.indexOf(a)) - (b === "_" ? 999 : labOrder.indexOf(b)); });
  var counts = document.getElementById("counts");
  counts.replaceChildren(h("span", {}, [h("b", { text: String(cards.length) }), " temas"]));
  S.listsAll.forEach(function (l) { var n = cards.filter(function (c) { return c.idList === l.id; }).length; if (n) counts.append(h("span", {}, [l.name + ": ", h("b", { text: String(n) })])); });
  var heads = ["", "Tema", "Etapa", "Potencial", "Links", "Por quê"];
  var tb = h("tbody");
  order.forEach(function (k) {
    var g = groups[k];
    g.cards.sort(function (a, b) { return stars(b) - stars(a) || listIdx(b.idList) - listIdx(a.idList) || (a.pos - b.pos); });
    var cc = col(g.lab && g.lab.color);
    tb.append(h("tr", { class: "grp" }, [h("td", { colspan: heads.length }, [g.lab ? h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1] + ";text-transform:none;letter-spacing:0", text: g.lab.name }) : "Sem projeto", "  · " + g.cards.length])]));
    g.cards.forEach(function (c) {
      var n = linkCount(c);
      var li = listIdx(c.idList), list = S.listsAll[li];
      var stage = h("button", { class: "pill", style: "background:" + (STAGE[li] || "#f1f2f4"), text: list ? list.name : "" });
      stage.addEventListener("click", function () { openMenu(stage, S.listsAll.map(function (l, i) { return { id: l.id, text: l.name, bg: STAGE[i] || "#f1f2f4" }; }), c.idList, function (id) { setList(c, id); }); });
      var o = potOf(c);
      var pot = h("button", { class: "pill", style: o ? "background:#fff7d6" : "background:#f1f2f4;color:#8590a2", text: o ? o.value.text : "—" });
      if (S.pot) pot.addEventListener("click", function () { openMenu(pot, [{ id: "", text: "—" }].concat(S.pot.options.map(function (op) { return { id: op.id, text: op.value.text, bg: "#fff7d6" }; })), o ? o.id : "", function (id) { setPot(c, id); }); });
      var why = whyOf(c);
      var ck = h("input", { type: "checkbox", "aria-label": "Selecionar " + c.name }); ck.checked = !!S.sel[c.id];
      ck.addEventListener("change", function () { if (ck.checked) S.sel[c.id] = true; else delete S.sel[c.id]; renderTable(); });
      tb.append(h("tr", {}, [
        h("td", { class: "ck" }, [ck]),
        h("td", { class: "name" }, [h("a", { href: c.url, text: c.name, onclick: function (e) { e.preventDefault(); t.showCard(c.id); } })]),
        h("td", { class: "fit" }, [stage]),
        h("td", { class: "fit" }, [pot]),
        h("td", { class: "fit" }, [h("span", { class: "links " + (n >= 3 ? "ok" : n ? "low" : "none"), text: n + (n === 1 ? " link" : " links") })]),
        h("td", { class: "why", text: why.length > 160 ? why.slice(0, 157) + "…" : why })
      ]));
    });
  });
  if (!cards.length) tb.append(h("tr", {}, [h("td", { colspan: heads.length, class: "note", text: "Nenhum tema com esses filtros." })]));
  var trh = h("tr"); heads.forEach(function (x, i) { trh.append(h("th", { class: i === 0 ? "ck" : i > 1 && i < 5 ? "fit" : null, text: x })); });
  closeMenu();
  var nsel = Object.keys(S.sel).filter(function (id) { return S.cards.some(function (c) { return c.id === id; }); }).length;
  var bar = nsel ? h("div", { class: "sendbar" }, [h("b", { text: nsel + " selecionado" + (nsel > 1 ? "s" : "") }), h("span", { style: "flex:1" }), h("button", { text: "Limpar", onclick: function () { S.sel = {}; renderTable(); } }), h("button", { class: "primary", text: "Enviar para a produção \u203A", onclick: openSend })]) : "";
  var tbl = document.getElementById("tbl"); tbl.onscroll = closeMenu; tbl.replaceChildren(h("table", {}, [h("thead", {}, [trh]), tb]));
  var old = document.querySelector(".sendbar"); if (old) old.remove();
  if (bar) tbl.before(bar);
}

var MENU = null;
function closeMenu() { if (MENU) { MENU.remove(); MENU = null; } }
document.addEventListener("mousedown", function (e) { if (MENU && !MENU.contains(e.target) && e.target !== MENU._owner) closeMenu(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
function openMenu(btn, opts, cur, onPick) {
  closeMenu();
  var menu = h("div", { class: "menu", role: "listbox" });
  opts.forEach(function (op) {
    var b = h("button", { role: "option" }, [h("span", { class: "chip", style: "background:" + (op.bg || "#f1f2f4"), text: op.text }), op.id === cur ? h("span", { text: "✓", style: "color:#0c66e4" }) : ""]);
    b.addEventListener("click", function () { closeMenu(); if (op.id !== cur) onPick(op.id); });
    menu.append(b);
  });
  document.body.append(menu); MENU = menu; menu._owner = btn;
  var r = btn.getBoundingClientRect(), mh = menu.offsetHeight;
  var top = r.bottom + 4; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
}
async function setList(c, id) {
  if (!S.token && !(await authorize())) return;
  try { await api("PUT", "/cards/" + c.id, { idList: id }); c.idList = id; renderTable(); } catch (e) { msg("Não moveu (" + e.message + ")."); }
}
async function setPot(c, id) {
  if (!S.token && !(await authorize())) return;
  try {
    await api("PUT", "/cards/" + c.id + "/customField/" + S.pot.id + "/item", id ? { idValue: id } : { idValue: "", value: "" });
    c.customFieldItems = (c.customFieldItems || []).filter(function (i) { return i.idCustomField !== S.pot.id; });
    if (id) c.customFieldItems.push({ idCustomField: S.pot.id, idValue: id });
    renderTable();
  } catch (e) { msg("Não salvou (" + e.message + ")."); }
}

/* ---------- enviar para a produção ---------- */
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseDay(v) { var p = v.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
function addD(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function offIdx(name) { return OFFSETS.findIndex(function (o) { return o[0].test(name.trim()); }); }
async function getJ(path) { var r = await fetch("https://api.trello.com/1" + path + (path.indexOf("?") < 0 ? "?" : "&") + "key=" + APP_KEY + "&token=" + S.token); if (!r.ok) throw new Error(r.status); return r.json(); }
async function openSend() {
  if (!S.token && !(await authorize())) return;
  var ov = h("div", { class: "ov" }, [h("div", { class: "panel" }, [h("p", { class: "note", text: "Carregando…" })])]);
  document.body.append(ov);
  try {
    var ids = Object.keys(S.sel).filter(function (id) { return S.cards.some(function (c) { return c.id === id; }); });
    var r = await Promise.all([getJ("/boards/" + PROD.board + "/members?fields=fullName"), getJ("/boards/" + PROD.board + "/lists?fields=name"), getJ("/boards/" + PROD.board + "/customFields"), getJ("/checklists/" + TPL_CHECKLIST + "?checkItems=all"), t.get("board", "private", "envio")]);
    var members = r[0], plists = r[1], pcf = r[2], tplItems = r[3].checkItems.sort(function (a, b) { return a.pos - b.pos; }).map(function (i) { return i.name; }), mem = r[4] || {};
    var dest = plists.find(function (l) { return PROD.list.test(l.name); }) || plists[0];
    var postF = pcf.find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
    var jobs = [];
    for (var i = 0; i < ids.length; i++) {
      var c = S.cards.find(function (x) { return x.id === ids[i]; });
      var cls = await getJ("/cards/" + c.id + "/checklists");
      var cl = cls.find(function (x) { return !/aprova/i.test(x.name); });
      var items = cl ? cl.checkItems.sort(function (a, b) { return a.pos - b.pos; }).map(function (it) { return { id: it.id, name: it.name }; }) : tplItems.map(function (n) { return { id: null, name: n }; });
      jobs.push({ card: c, items: items, needChecklist: !cl });
    }
    var panel = h("div", { class: "panel" }, [
      h("h2", { text: "Enviar " + ids.length + " tema" + (ids.length > 1 ? "s" : "") + " para a produção" }),
      h("p", { class: "note", text: "Vão para a lista " + dest.name + ". Escolha a data de postagem e quem faz o roteiro; os prazos se ajustam sozinhos (dá para mudar). As outras etapas ficam para depois, na produção. Quem você escolhe é lembrado por projeto." })
    ]);
    jobs.forEach(function (j) {
      var lab = project(j.card), cc = col(lab && lab.color), labKey = lab ? lab.id.slice(-6) : "_";
      var post = h("input", { type: "date", "aria-label": "Data de postagem" });
      var rows = h("tbody");
      j.rows = j.items.filter(function (it) { return NO_ENVIO.test(it.name); }).map(function (it) {
        var k = offIdx(it.name), key = labKey + ":" + k;
        var sel = h("select", { "aria-label": "Responsável por " + it.name }, [h("option", { value: "", text: "— ninguém —" })].concat(members.map(function (m) { var o = h("option", { value: m.id, text: m.fullName }); if (mem[key] === m.id) o.selected = true; return o; })));
        var due = h("input", { type: "date", "aria-label": "Prazo de " + it.name });
        due.addEventListener("change", function () { due._manual = true; });
        rows.append(h("tr", {}, [h("td", { text: it.name }), h("td", {}, [sel]), h("td", {}, [due])]));
        return { it: it, sel: sel, due: due, k: k, key: key };
      });
      function fill() {
        if (!post.value) return;
        var pd = parseDay(post.value);
        j.rows.forEach(function (x) { if (x.due._manual) return; var o = OFFSETS[x.k] ? OFFSETS[x.k][1] : -1; x.due.value = iso(o === null ? new Date() : addD(pd, o)); });
      }
      post.addEventListener("change", fill);
      /* se o tema já tem data de postagem no Brainstorm, ela vem preenchida */
      var bpf = (S.board.customFields || []).find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
      var bpi = bpf && (j.card.customFieldItems || []).find(function (i) { return i.idCustomField === bpf.id; });
      if (bpi && bpi.value && bpi.value.date) { post.value = iso(new Date(bpi.value.date)); fill(); }
      j.post = post; j.fill = fill; j.status = h("span", { class: "st" });
      panel.append(h("div", { class: "sc" }, [
        h("div", { class: "hd" }, [lab ? h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: lab.name }) : "", h("b", { text: j.card.name }), h("label", { class: "note" }, ["Postagem ", post]), j.status]),
        h("table", {}, [rows])
      ]));
    });
    /* com mais de um tema: preencher todos de uma vez (mesma pessoa e mesma data em cada etapa) */
    if (jobs.length > 1) {
      var ks = [];
      jobs.forEach(function (j) { j.rows.forEach(function (x) { if (!ks.some(function (y) { return y.k === x.k; })) ks.push({ k: x.k, name: x.it.name }); }); });
      var bp = h("input", { type: "date", "aria-label": "Postagem para todos" });
      var brows = h("tbody");
      var bs = ks.map(function (y) {
        var sel = h("select", { "aria-label": "Responsável por " + y.name + " em todos" }, [h("option", { value: "", text: "— não mudar —" })].concat(members.map(function (m) { return h("option", { value: m.id, text: m.fullName }); })));
        var due = h("input", { type: "date", "aria-label": "Prazo de " + y.name + " em todos" });
        brows.append(h("tr", {}, [h("td", { text: y.name }), h("td", {}, [sel]), h("td", {}, [due])]));
        return { k: y.k, sel: sel, due: due };
      });
      var bmsg = h("span", { class: "st" });
      var apply = h("button", { class: "primary", text: "Aplicar a todos" });
      apply.addEventListener("click", function () {
        jobs.forEach(function (j) {
          if (bp.value) { j.post.value = bp.value; j.fill(); }
          bs.forEach(function (b) {
            j.rows.filter(function (x) { return x.k === b.k; }).forEach(function (x) {
              if (b.sel.value) x.sel.value = b.sel.value;
              if (b.due.value) { x.due.value = b.due.value; x.due._manual = true; }
            });
          });
        });
        bmsg.textContent = "✓ aplicado nos " + jobs.length + " temas (dá para ajustar um por um abaixo)";
      });
      var bulk = h("div", { class: "sc bulk" }, [
        h("div", { class: "hd" }, [h("b", { text: "Para todos os " + jobs.length + " temas" }), h("label", { class: "note" }, ["Postagem ", bp]), apply, bmsg]),
        h("table", {}, [brows]),
        h("p", { class: "note", style: "padding:6px 12px 8px", text: "Deixe o prazo vazio para ele ser calculado pela data de postagem de cada tema." })
      ]);
      var firstSc = panel.querySelector(".sc");
      if (firstSc) panel.insertBefore(bulk, firstSc); else panel.append(bulk);
    }
    var go = h("button", { class: "primary", text: "Enviar para " + dest.name });
    var cancel = h("button", { text: "Cancelar", onclick: function () { ov.remove(); } });
    var info = h("span", { class: "note" });
    panel.append(h("div", { class: "foot" }, [info, cancel, go]));
    ov.replaceChildren(panel);
    go.addEventListener("click", async function () {
      if (jobs.some(function (j) { return !j.post.value; })) { info.textContent = "Coloque a data de postagem em todos."; info.className = "note err"; return; }
      go.disabled = true; cancel.disabled = true; info.className = "note"; info.textContent = "Enviando…";
      var okAll = true;
      for (var n = 0; n < jobs.length; n++) {
        var j = jobs[n];
        try { await sendOne(j, dest, postF, mem); j.status.textContent = "✓ enviado"; delete S.sel[j.card.id]; }
        catch (e) { okAll = false; j.status.textContent = "não foi (" + e.message + ")"; j.status.style.color = "#ae2e24"; }
      }
      try { await t.set("board", "private", "envio", mem); } catch (e) {}
      info.textContent = okAll ? "Pronto. Os temas já estão em " + dest.name + "." : "Alguns não foram; veja acima.";
      cancel.disabled = false; cancel.textContent = "Fechar"; cancel.onclick = function () { ov.remove(); load(); };
    });
  } catch (e) { ov.replaceChildren(h("div", { class: "panel" }, [h("p", { class: "err", text: "Não deu para abrir o envio (" + e.message + ")." }), h("button", { text: "Fechar", onclick: function () { ov.remove(); } })])); }
}
async function sendOne(j, dest, postF, mem) {
  var c = j.card, cid = c.id;
  /* o porquê fica registrado como comentário; os campos do quadro de temas não vão junto */
  var why = whyOf(c);
  if (why) await api("POST", "/cards/" + cid + "/actions/comments", { text: "Por quê / Potencial (do Brainstorm de Temas): " + why });
  for (var i = 0; i < (c.customFieldItems || []).length; i++) {
    var fi = c.customFieldItems[i], f = (S.board.customFields || []).find(function (x) { return x.id === fi.idCustomField; });
    await api("PUT", "/cards/" + cid + "/customField/" + fi.idCustomField + "/item", f && f.type === "list" ? { idValue: "" } : { value: "" });
  }
  if (j.needChecklist) {
    await api("POST", "/cards/" + cid + "/checklists", { idChecklistSource: TPL_CHECKLIST });
    var cls = await getJ("/cards/" + cid + "/checklists");
    var cl = cls.find(function (x) { return !/aprova/i.test(x.name); });
    var its = cl.checkItems.sort(function (a, b) { return a.pos - b.pos; });
    j.rows.forEach(function (x) { var m = its.find(function (i) { return i.name === x.it.name; }); x.it.id = m && m.id; });
  }
  await api("PUT", "/cards/" + cid, { idBoard: PROD.board, idList: dest.id, pos: "bottom" });
  if (postF) await api("PUT", "/cards/" + cid + "/customField/" + postF.id + "/item", { value: { date: parseDay(j.post.value).toISOString() } });
  for (var k = 0; k < j.rows.length; k++) {
    var x = j.rows[k]; if (!x.it.id) continue;
    var body = {};
    if (x.sel.value) { body.idMember = x.sel.value; mem[x.key] = x.sel.value; }
    if (x.due.value) body.due = parseDay(x.due.value).toISOString();
    if (body.idMember || body.due) await api("PUT", "/cards/" + cid + "/checkItem/" + x.it.id, body);
  }
}
