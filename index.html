<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planilha Projeto Curioso</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root{--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--bg:#fff;--soft:#f4f5f7;--accent:#0c66e4}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{padding:16px 20px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.bar input[type=search]{min-width:220px}
.bar label{display:inline-flex;align-items:center;gap:6px}
.bar .sp{flex:1}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--muted);font-size:13px}
.err{color:#ae2e24}
.counts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:13px;color:var(--muted)}
.counts b{color:var(--ink);font-weight:600}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{position:sticky;top:0;z-index:1;background:#5b3a8c;color:#fff;text-align:left;font-weight:600;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none}
th.nosort{cursor:default}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--soft)}
td.name{min-width:260px;max-width:380px}
td.name a{color:var(--ink);text-decoration:none;font-weight:500}
td.name a:hover{text-decoration:underline}
.grp td{background:var(--soft);font-weight:600;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chips button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 10px}
.chips button:last-child{border-right:0}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
input.dt{font:inherit;font-size:13px;padding:3px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);width:128px}
input.dt:hover,input.dt:focus{border-color:var(--line);background:#fff}
.wd{color:var(--muted);font-size:12px;margin-left:2px}
th.fit,td.fit{width:1%;white-space:nowrap;padding-right:24px}
.datebtn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid transparent;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.datebtn:hover,.datebtn:focus-within{border-color:var(--line);background:#fff}
.datebtn .wd{display:inline-block;width:28px;margin:0;font-weight:600;color:var(--muted)}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.datebtn input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;cursor:pointer}
.sub{display:block;color:var(--muted);font-size:12px}
td.name .nm{display:flex;align-items:flex-start;gap:10px}
td.name input.ok{width:16px;height:16px;margin:2px 0 0;flex:none;cursor:pointer;accent-color:#1f845a}
tr.done td{background:#fafbfc}
tr.done td>*{opacity:.45}
tr.ext td{background:#fafbfc;color:var(--muted)}
tr.ext td.name a{color:var(--muted);font-style:italic}
.xtag{display:inline-block;font-size:11px;font-weight:600;color:#5e4db2;background:#f3f0ff;border-radius:4px;padding:1px 6px;margin-left:6px;font-style:normal}
tr.done td.name a{text-decoration:line-through}
tr.nodate td{cursor:pointer;background:#fff7e6;color:#7f5f01}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.dd{position:relative;display:inline-block}
.dd>button{min-width:170px;text-align:left}
.ddp{position:absolute;z-index:5;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(9,30,66,.18);padding:8px;min-width:240px;max-height:360px;overflow:auto}
.ddp label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}
.ddp label:hover{background:var(--soft)}
.ddp .row{display:flex;gap:6px;margin-bottom:6px}
.ddp .row button{padding:3px 8px;font-size:12px}
.lab{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;margin:1px 4px 1px 0;white-space:nowrap}
.late{color:#ae2e24;font-weight:600}
select.st{appearance:none;-webkit-appearance:none;width:100%;min-width:120px;font:inherit;font-size:13px;padding:5px 24px 5px 10px;border-radius:999px;border:0;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.pill{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-width:120px;font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:0;cursor:pointer;text-align:left}
.pill::after{content:"\25BE";font-size:10px;opacity:.7}
.pill.saving{opacity:.5}
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(9,30,66,.2);padding:6px;min-width:180px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:4px 6px;border-radius:6px;text-align:left}
.menu button:hover,.menu button:focus{background:var(--soft);outline:none}
.menu .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px}
.menu .ok{color:var(--accent);font-size:13px}
</style>
</head>
<body>
<div id="app"><p class="note">Carregando…</p></div>
<script>
/* Configuração: a chave da API vem do painel de admin de Power-Ups do Trello (pode ficar pública). */
var APP_KEY = "d7dce7c9a2c664af9701e49ee088a979";
var APP_NAME = "Planilha Projeto Curioso";
var ICON = "";

var VIEW = new URLSearchParams(location.search).get("view");

/* ---------- conector (sem ?view): só registra o botão no quadro ---------- */
if (VIEW !== "table") {
  document.getElementById("app").innerHTML = "";
  var base = location.href.split("?")[0];
  ICON = base.replace(/index\.html$/, "").replace(/\/?$/, "/") + "icon.svg";
  TrelloPowerUp.initialize({
    "board-buttons": function (t0) {
      var dir = base.replace(/index\.html$/, "").replace(/\/?$/, "/");
      return Promise.all([t0.member("fullName"), t0.board("customFields")]).then(function (rr) { var m = rr[0];
      /* quadro de temas (tem o campo Potencial): só a planilha de temas */
      if ((rr[1].customFields || []).some(function (f) { return /potencial/i.test(f.name); })) return [{
        icon: { dark: ICON, light: ICON },
        text: "Planilha de temas",
        callback: function (t) { return t.modal({ url: dir + "temas.html?v=" + Date.now(), fullscreen: true, title: "Temas" }); }
      }];
      var B = [{
        icon: { dark: ICON, light: ICON },
        text: "Tarefas",
        callback: function (t) {
          return t.modal({ url: base.replace(/index\.html$/, "").replace(/\/?$/, "/") + "tarefas.html?v=" + Date.now(), fullscreen: true, title: "Tarefas da semana" });
        }
      }, {
        icon: { dark: ICON, light: ICON },
        text: "Planilha",
        callback: function (t) {
          return t.modal({ url: base + "?view=table&v=" + Date.now(), fullscreen: true, title: "Planilha" });
        }
      }, {
        icon: { dark: ICON, light: ICON },
        text: "Cronograma",
        callback: function (t) {
          return t.modal({ url: dir + "cronograma.html?v=" + Date.now(), fullscreen: true, title: "Cronograma" });
        }
      }];
      if (/rodrigo/i.test(m.fullName || "")) B.push({
        icon: { dark: ICON, light: ICON },
        text: "Fechamento",
        callback: function (t) {
          return t.modal({ url: base.replace(/index\.html$/, "").replace(/\/?$/, "/") + "fechamento.html?v=" + Date.now(), fullscreen: true, title: "Fechamento do mês" });
        }
      });
      return B; });
    }
  }, APP_KEY ? { appKey: APP_KEY, appName: APP_NAME } : {});
} else {
  startTable();
}

/* ---------- tabela ---------- */
function startTable() {
  var t = TrelloPowerUp.iframe(APP_KEY ? { appKey: APP_KEY, appName: APP_NAME } : {});
  var COLORS = {
    green: ["#4bce97", "#0d2e20"], yellow: ["#f5cd47", "#3d2e00"], orange: ["#fea362", "#4a1f00"],
    red: ["#f87168", "#4a120d"], purple: ["#9f8fef", "#231c47"], blue: ["#579dff", "#06224a"],
    sky: ["#6cc3e0", "#0e3240"], lime: ["#94c748", "#25330f"], pink: ["#e774bb", "#40122f"],
    black: ["#44546f", "#ffffff"], none: ["#f1f2f4", "#44546f"]
  };
  var PERIODS = [["esta", "Esta semana"], ["proximos", "Esta semana e próximas"], ["todos", "Todos"]];
  var DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  function col(c) { if (!c) return COLORS.none; var b = c.replace(/_(light|dark)$/, ""); return COLORS[b] || COLORS.none; }
  var period = "proximos";
  var S = { board: null, lists: [], cards: [], fields: [], postField: null, q: "", labels: [], listSel: [], hideDone: false, showNoDate: false, token: null, open: "" };
  /* preferências de cada pessoa ficam salvas no próprio Trello (privadas por membro e por quadro) */
  async function loadPrefs() { try { var p = await t.get("board", "private", "planilha"); if (p) { period = PERIODS.some(function (x) { return x[0] === p.period; }) ? p.period : period; S.labels = p.labels || []; S.listSel = p.lists || []; S.hideDone = !!p.hideDone; } } catch (e) {} }
  function savePrefs() { try { t.set("board", "private", "planilha", { period: period, labels: S.labels, lists: S.listSel, hideDone: S.hideDone }); } catch (e) {} }
  var app = document.getElementById("app");
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === "text") el.textContent = attrs[k];
      else if (k === "style") el.setAttribute("style", attrs[k]);
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
    return el;
  }

  async function load() {
    try {
      var r = await Promise.all([
        t.board("id", "name", "labels", "customFields"),
        t.lists("id", "name"),
        t.cards("id", "name", "due", "dueComplete", "labels", "idList", "url", "pos", "customFieldItems")
      ]);
      S.board = r[0]; S.lists = r[1]; S.cards = r[2];
      if (!S.prefsLoaded) { await loadPrefs(); S.prefsLoaded = true; }
      S.labels = S.labels.filter(function (id) { return (S.board.labels || []).some(function (l) { return l.id === id; }); });
      S.listSel = S.listSel.filter(function (id) { return S.lists.some(function (l) { return l.id === id; }); });
      var cfs = (S.board.customFields || []).slice().sort(function (a, b) { return (a.pos || 0) - (b.pos || 0); });
      S.fields = cfs.filter(function (f) { return f.type === "list"; });
      S.postField = cfs.find(function (f) { return f.type === "date" && /postag/i.test(f.name); }) || null;
      try { if (APP_KEY && await t.getRestApi().isAuthorized()) S.token = await t.getRestApi().getToken(); } catch (e) {}
      await loadBrainstorm();
      render();
      /* acerta os status pela lista em segundo plano; quando muda algo, redesenha a tabela */
      if (S.token) syncByList({ cards: S.cards, lists: S.lists, fields: S.board.customFields, postDate: postDate, checklists: null, call: api, boardId: S.board.id }).then(function (n) { if (n) renderTable(); }, function () {});
    } catch (e) {
      app.replaceChildren(h("p", { class: "err", text: "Não foi possível ler o quadro: " + (e && e.message || e) }));
    }
  }

  function item(card, f) { return (card.customFieldItems || []).find(function (i) { return i.idCustomField === f.id; }); }
  function valueOf(card, f) { var it = item(card, f); return it ? it.idValue : ""; }
  function optOf(f, id) { return (f.options || []).find(function (o) { return o.id === id; }); }
  function optText(o) { return o ? (o.value && o.value.text) || "" : ""; }
  function listName(id) { var l = S.lists.find(function (x) { return x.id === id; }); return l ? l.name : ""; }
  /* a lista em que o cartão está define o mínimo de cada status (o que já está mais adiantado não volta):
     ESCREVENDO = roteiro em execução (atrasado se passou do prazo do item do roteiro); REVISÃO ROTEIROS/TRADUÇÃO = roteiro concluído e tradução em execução;
     FILA DE EDIÇÃO = roteiro e tradução concluídos; EDITANDO = edição em execução; REVISÃO VÍDEO = edição para revisar;
     VÍDEO APROVADO = edição concluída e publicação em execução; VÍDEO POSTADO = tudo concluído, publicado e cartão concluído.
     Só mexe em vídeos com postagem dos últimos 30 dias para frente. */
  var TPL_CHECKLIST_ID = "6ad69a8e90a4f4636a5c41a4";
  var RT = [/^tema/i, /brainstorm/i], RR = /produ.*rotei|^roteiro$/i, RV = /revis.*rotei/i, TR = /tradu/i;
  var LIST_RULES = [
    { at: /escrevendo/i, set: { R: "exec" }, chk: RT, tpl: true, late: true },
    { at: /revis.*rotei/i, set: { R: "done", T: "exec" }, chk: RT.concat([RR]) },
    { at: /^tradu/i, set: { R: "done", T: "exec" }, chk: RT.concat([RR, RV]) },
    { at: /fila.*edi/i, set: { R: "done", T: "done" }, chk: RT.concat([RR, RV, TR]) },
    { at: /editando/i, set: { R: "done", T: "done", E: "exec" }, chk: RT.concat([RR, RV, TR]) },
    { at: /revis.*v[ií]deo/i, set: { R: "done", T: "done", E: "rev" }, chk: RT.concat([RR, RV, TR]) },
    { at: /aprovad/i, set: { R: "done", T: "done", E: "done", P: "exec" }, chk: RT.concat([RR, RV, TR, /edi[cç]|montagem/i, /revis.*v[ií]deo/i]) },
    { at: /postado/i, set: { R: "done", T: "done", E: "done", P: "done" }, chk: RT.concat([RR, RV, TR, /edi[cç]|montagem/i, /revis.*v[ií]deo/i, /postag|publica/i]), done: true }
  ];
  var FIELD_RE = { R: /roteir/i, T: /tradu/i, E: /edi[cç]/i, P: /publica/i };
  var TARGET = { exec: [1, /execu/i], late: [2, /atrasad/i], rev: [3, /revisar/i], done: [4, /conclu|publicad/i] };
  function statusRank(txt) {
    if (!txt || /n[aã]o inic/i.test(txt)) return 0;
    if (/conclu|publicad/i.test(txt)) return 4;
    if (/revisar|corre/i.test(txt)) return 3;
    if (/atrasad/i.test(txt)) return 2;
    return 1;
  }
  async function syncByList(o) {
    var last = o.lists.findIndex(function (l) { return /postado/i.test(l.name); });
    var cut = new Date(); cut.setDate(cut.getDate() - 30);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var todo = [];
    o.cards.forEach(function (c) {
      if (/^TEMPLATE/i.test(c.name)) return;
      var pd = o.postDate(c); if (!pd || pd < cut) return;
      var li = o.lists.findIndex(function (l) { return l.id === c.idList; });
      if (li < 0 || (last >= 0 && li > last)) return;
      var rule = LIST_RULES.find(function (r) { return r.at.test(o.lists[li].name); });
      if (rule) todo.push({ c: c, r: rule });
    });
    if (!todo.length) return 0;
    var checks = o.checklists;
    if (!checks) {
      checks = {};
      var all = await (await o.call("GET", "/boards/" + o.boardId + "/checklists?checkItem_fields=name,state,due")).json();
      all.forEach(function (cl) { (checks[cl.idCard] = checks[cl.idCard] || []).push(cl); });
    }
    var n = 0;
    for (var i = 0; i < todo.length; i++) {
      var c = todo[i].c, r = todo[i].r;
      var cls = (checks[c.id] || []).filter(function (cl) { return !/aprova/i.test(cl.name); });
      if (r.tpl && !cls.length) { await o.call("POST", "/cards/" + c.id + "/checklists", { idChecklistSource: TPL_CHECKLIST_ID }); n++; continue; }
      var items = []; cls.forEach(function (cl) { (cl.checkItems || []).forEach(function (it) { items.push(it); }); });
      var set = Object.assign({}, r.set);
      if (r.late && items.some(function (it) { return RR.test(it.name) && it.state !== "complete" && it.due && new Date(it.due) < today; })) set.R = "late";
      var keys = Object.keys(set);
      for (var k = 0; k < keys.length; k++) {
        var f = (o.fields || []).find(function (x) { return x.type === "list" && FIELD_RE[keys[k]].test(x.name); });
        if (!f) continue;
        var tg = TARGET[set[keys[k]]];
        var cur = (c.customFieldItems || []).find(function (x) { return x.idCustomField === f.id; });
        var opt = cur && (f.options || []).find(function (op) { return op.id === cur.idValue; });
        if (statusRank(opt && opt.value.text) >= tg[0]) continue;
        var want = (f.options || []).find(function (op) { return tg[1].test(op.value.text); });
        if (!want) continue;
        await o.call("PUT", "/cards/" + c.id + "/customField/" + f.id + "/item", { idValue: want.id });
        c.customFieldItems = (c.customFieldItems || []).filter(function (x) { return x.idCustomField !== f.id; }).concat([{ idCustomField: f.id, idValue: want.id }]);
        n++;
      }
      for (var b = 0; b < items.length; b++) {
        var it = items[b];
        if (it.state === "complete" || !r.chk.some(function (re) { return re.test(it.name.trim()); })) continue;
        await o.call("PUT", "/cards/" + c.id + "/checkItem/" + it.id, { state: "complete" });
        it.state = "complete"; n++;
      }
      if (r.done && !c.dueComplete) { await o.call("PUT", "/cards/" + c.id, { dueComplete: true }); c.dueComplete = true; n++; }
    }
    return n;
  }
  /* temas do Brainstorm que já têm data de postagem aparecem na semana deles, só para ver */
  var BRAIN = "6ad78bf2e6a07b19369b36e6";
  async function loadBrainstorm() {
    S.ext = [];
    if (!S.token || S.board.id === BRAIN) return;
    try {
      var r = await Promise.all([api("GET", "/boards/" + BRAIN + "/customFields"), api("GET", "/boards/" + BRAIN + "/lists?fields=name"), api("GET", "/boards/" + BRAIN + "/cards?fields=name,labels,idList,url&customFieldItems=true")]);
      var bf = await r[0].json(), bl = await r[1].json(), bc = await r[2].json();
      var pf = bf.find(function (f) { return f.type === "date" && /postag/i.test(f.name); });
      if (!pf) return;
      bc.forEach(function (c) {
        if (/^TEMPLATE/i.test(c.name)) return;
        var l = bl.find(function (x) { return x.id === c.idList; });
        if (l && /descart/i.test(l.name)) return;
        var it = (c.customFieldItems || []).find(function (i) { return i.idCustomField === pf.id; });
        if (it && it.value && it.value.date) S.ext.push({ id: c.id, name: c.name, labels: c.labels || [], url: c.url, ext: true, extDate: new Date(it.value.date), extList: l ? l.name : "" });
      });
    } catch (e) {}
  }
  function extOk(c) {
    var q = S.q.trim().toLowerCase();
    if (q && c.name.toLowerCase().indexOf(q) < 0) return false;
    if (S.labels.length) {
      var names = (S.board.labels || []).filter(function (l) { return S.labels.indexOf(l.id) >= 0; }).map(function (l) { return l.name; });
      if (!c.labels.some(function (l) { return names.indexOf(l.name) >= 0; })) return false;
    }
    return true;
  }
  function postDate(card) {
    if (card.ext) return card.extDate;
    if (S.postField) { var it = item(card, S.postField); if (it && it.value && it.value.date) return new Date(it.value.date); return null; }
    return card.due ? new Date(card.due) : null;
  }
  function dd(x) { return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0"); }
  function iso(x) { return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
  function monday(x) { var d = new Date(x.getFullYear(), x.getMonth(), x.getDate()); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return d; }
  function addDays(x, n) { var d = new Date(x); d.setDate(d.getDate() + n); return d; }
  var W0 = monday(new Date()), W1 = addDays(W0, 7), W2 = addDays(W0, 14);
  function inPeriod(d) {
    if (!d) return false;
    if (period === "esta") return d >= W0 && d < W1;
    if (period === "proximos") return d >= W0;
    return true;
  }
  function weekLabel(m) {
    var e = addDays(m, 6), base = dd(m) + " a " + dd(e);
    if (+m === +W0) return "Esta semana · " + base;
    if (+m === +W1) return "Próxima semana · " + base;
    if (+m === +addDays(W0, -7)) return "Semana passada · " + base;
    return "Semana de " + base;
  }

  async function authorize() {
    if (!APP_KEY) { alertBox("Falta configurar a chave da API do Power-Up."); return false; }
    try {
      await t.getRestApi().authorize({ scope: "read,write", expiration: "never" });
      S.token = await t.getRestApi().getToken();
      render();
      return true;
    } catch (e) { alertBox("Autorização cancelada."); return false; }
  }
  function alertBox(msg) { var n = document.getElementById("msg"); if (n) { n.textContent = msg; n.className = "note err"; } }
  async function api(method, path, body) {
    var res = await fetch("https://api.trello.com/1" + path + (path.indexOf("?") < 0 ? "?" : "&") + "key=" + APP_KEY + "&token=" + S.token, { method: method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    if (!res.ok) { if (res.status === 401) S.token = null; throw new Error(res.status); }
    return res;
  }

  async function setValue(card, f, idValue, sel) {
    if (!S.token && !(await authorize())) { render(); return; }
    sel.classList.add("saving"); sel.disabled = true;
    try {
      await api("PUT", "/cards/" + card.id + "/customField/" + f.id + "/item", idValue ? { idValue: idValue } : { idValue: "", value: "" });
      var items = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
      if (idValue) items.push({ idCustomField: f.id, idValue: idValue });
      card.customFieldItems = items;
      renderTable();
      syncChecklist(card, f, idValue);
    } catch (e) {
      alertBox("Não salvou (" + e.message + "). Tente de novo.");
      sel.classList.remove("saving"); sel.disabled = false;
    }
  }

  /* status concluído aqui = item marcado no checklist do cartão (e vice-versa no Tarefas) */
  var FIELD_ITEM = [
    { f: /roteir/i, i: /roteir/i, not: /revis|tradu/i },
    { f: /tradu/i, i: /tradu/i },
    { f: /thumb/i, i: /thumb/i, not: /brainstorm/i },
    { f: /edi[cç]/i, i: /edi[cç]|montagem/i, not: /revis/i },
    { f: /publica/i, i: /postagem|publica/i }
  ];
  async function syncChecklist(card, f, idValue) {
    try {
      var m = FIELD_ITEM.find(function (x) { return x.f.test(f.name); }); if (!m) return;
      var want = /conclu|publicad/i.test(optText(optOf(f, idValue))) ? "complete" : "incomplete";
      var cls = await (await api("GET", "/cards/" + card.id + "/checklists?checkItem_fields=name,state")).json();
      var found = [];
      cls.forEach(function (cl) { if (/aprova/i.test(cl.name)) return; (cl.checkItems || []).forEach(function (it) { if (m.i.test(it.name) && !(m.not && m.not.test(it.name))) found.push(it); }); });
      if (found.length !== 1 || found[0].state === want) return;
      await api("PUT", "/cards/" + card.id + "/checkItem/" + found[0].id, { state: want });
    } catch (e) {}
  }

  /* caixa de seleção = o "concluído" do próprio cartão no Trello */
  async function setDone(card, val, cb) {
    if (!S.token && !(await authorize())) { renderTable(); return; }
    cb.disabled = true;
    try { await api("PUT", "/cards/" + card.id, { dueComplete: val }); card.dueComplete = val; renderTable(); }
    catch (e) { alertBox("Não salvou (" + e.message + ")."); cb.checked = !val; cb.disabled = false; }
  }

  async function setPost(card, value, input) {
    if (!S.token && !(await authorize())) { renderTable(); return; }
    input.disabled = true;
    try {
      var f = S.postField;
      if (!value) {
        await api("PUT", "/cards/" + card.id + "/customField/" + f.id + "/item", { value: "" });
        card.customFieldItems = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
      } else {
        var p = value.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
        await api("PUT", "/cards/" + card.id + "/customField/" + f.id + "/item", { value: { date: d.toISOString() } });
        var items = (card.customFieldItems || []).filter(function (i) { return i.idCustomField !== f.id; });
        items.push({ idCustomField: f.id, value: { date: d.toISOString() } });
        card.customFieldItems = items;
      }
      renderTable();
    } catch (e) { alertBox("Não salvou a data (" + e.message + ")."); input.disabled = false; }
  }

  var MENU = null;
  function closeMenu() { if (MENU) { MENU.remove(); MENU = null; } }
  document.addEventListener("mousedown", function (e) { if (MENU && !MENU.contains(e.target) && e.target !== MENU._owner) closeMenu(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
  window.addEventListener("resize", closeMenu);
  function pillStyle(o) { var c = col(o && o.color); return o ? "background-color:" + c[0] + ";color:" + c[1] : "background-color:#f1f2f4;color:#8590a2"; }
  function openMenu(btn, card, f, cur) {
    closeMenu();
    var menu = h("div", { class: "menu", role: "listbox", "aria-label": f.name });
    var opts = [{ id: "", text: "\u2014" }].concat((f.options || []).map(function (op) { return { id: op.id, text: optText(op), o: op }; }));
    var items = opts.map(function (op) {
      var b = h("button", { role: "option", "aria-selected": op.id === cur ? "true" : "false" }, [h("span", { class: "chip", style: pillStyle(op.o), text: op.text }), op.id === cur ? h("span", { class: "ok", text: "\u2713" }) : null]);
      b.addEventListener("click", function () { closeMenu(); btn.focus(); if (op.id !== cur) setValue(card, f, op.id, btn); });
      b.addEventListener("keydown", function (e) {
        var k = items.indexOf(b);
        if (e.key === "ArrowDown") { e.preventDefault(); items[Math.min(k + 1, items.length - 1)].focus(); }
        if (e.key === "ArrowUp") { e.preventDefault(); items[Math.max(k - 1, 0)].focus(); }
        if (e.key === "Tab") closeMenu();
      });
      menu.append(b); return b;
    });
    document.body.append(menu); MENU = menu; menu._owner = btn;
    var r = btn.getBoundingClientRect(), mh = menu.offsetHeight, mw = Math.max(menu.offsetWidth, r.width);
    menu.style.minWidth = r.width + "px";
    var top = r.bottom + 4; if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    var left = Math.min(r.left, window.innerWidth - mw - 8);
    menu.style.top = top + "px"; menu.style.left = Math.max(8, left) + "px";
    (items[opts.findIndex(function (x) { return x.id === cur; })] || items[0]).focus();
  }
  function statusSelect(card, f) {
    var cur = valueOf(card, f), o = optOf(f, cur);
    var btn = h("button", { class: "pill", style: pillStyle(o), "aria-haspopup": "listbox", "aria-label": f.name + " de " + card.name + ": " + (o ? optText(o) : "vazio"), text: o ? optText(o) : "\u2014" });
    btn.addEventListener("click", function () { if (MENU && MENU._owner === btn) { closeMenu(); return; } openMenu(btn, card, f, cur); });
    btn.addEventListener("keydown", function (e) { if (e.key === "ArrowDown") { e.preventDefault(); openMenu(btn, card, f, cur); } });
    return btn;
  }

  function baseFilter(c) {
    var q = S.q.trim().toLowerCase();
    if (/^TEMPLATE/i.test(c.name)) return false;
    if (q && c.name.toLowerCase().indexOf(q) < 0) return false;
    if (S.labels.length && !(c.labels || []).some(function (l) { return S.labels.indexOf(l.id) >= 0; })) return false;
    if (S.listSel.length && S.listSel.indexOf(c.idList) < 0) return false;
    if (S.hideDone && c.dueComplete) return false;
    return true;
  }
  function visibleCards() {
    var out = S.cards.filter(function (c) { return baseFilter(c) && inPeriod(postDate(c)); })
      .concat((S.ext || []).filter(function (c) { return extOk(c) && inPeriod(c.extDate); }));
    out.sort(function (a, b) { return postDate(a) - postDate(b); });
    return out;
  }
  /* vídeos sem data de postagem (temas potenciais etc.) ficam numa aba recolhida no fim */
  function noDateCards() {
    var pos = {}; S.lists.forEach(function (l, i) { pos[l.id] = i; });
    return S.cards.filter(function (c) { return baseFilter(c) && !postDate(c); }).sort(function (a, b) { return (pos[a.idList] - pos[b.idList]) || ((a.pos || 0) - (b.pos || 0)); });
  }

  /* seletor de várias opções (usado para canais e para listas) */
  function multiPicker(key, items, selKey, allTxt, oneTxt, manyTxt, chip) {
    var sel = S[selKey];
    var names = items.filter(function (l) { return sel.indexOf(l.id) >= 0; }).map(function (l) { return l.name; });
    var txt = !names.length ? allTxt : names.length === 1 ? oneTxt + names[0] : manyTxt + names.length + " selecionadas";
    var wrap = h("div", { class: "dd" });
    wrap.append(h("button", { "aria-expanded": S.open === key ? "true" : "false", text: txt + " ▾", onclick: function () { S.open = S.open === key ? "" : key; render(); } }));
    if (S.open === key) {
      var panel = h("div", { class: "ddp" }, [h("div", { class: "row" }, [
        h("button", { text: "Todas", onclick: function () { S[selKey] = []; savePrefs(); render(); } }),
        h("button", { text: "Fechar", onclick: function () { S.open = ""; render(); } })
      ])]);
      items.forEach(function (l) {
        var cb = h("input", { type: "checkbox" }); cb.checked = sel.indexOf(l.id) >= 0;
        cb.addEventListener("change", function () {
          if (cb.checked) S[selKey].push(l.id); else S[selKey] = S[selKey].filter(function (x) { return x !== l.id; });
          savePrefs(); render();
        });
        var cc = col(l.color);
        panel.append(h("label", {}, [cb, chip ? h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: l.name }) : h("span", { text: l.name })]));
      });
      wrap.append(panel);
    }
    return wrap;
  }

  function render() {
    var labels = (S.board.labels || []).filter(function (l) { return l.name; });
    var chips = h("div", { class: "chips", role: "group", "aria-label": "Período" });
    PERIODS.forEach(function (p) {
      chips.append(h("button", { "aria-pressed": p[0] === period ? "true" : "false", text: p[1], onclick: function () { period = p[0]; savePrefs(); render(); } }));
    });
    var bar = h("div", { class: "bar" }, [
      chips,
      h("input", { type: "search", placeholder: "Buscar vídeo", value: S.q, oninput: function (e) { S.q = e.target.value; renderTable(); } }),
      multiPicker("canais", labels, "labels", "Canais: todos", "Canal: ", "Canais: ", true),
      multiPicker("listas", S.lists, "listSel", "Todas as listas", "Lista: ", "Listas: ", false),
      (function () { var cb = h("input", { type: "checkbox" }); cb.checked = S.hideDone; cb.addEventListener("change", function () { S.hideDone = cb.checked; savePrefs(); renderTable(); }); return h("label", { class: "toggle" }, [cb, "Ocultar concluídos"]); })(),
      h("span", { class: "sp" }),
      S.token || !APP_KEY ? null : h("button", { class: "primary", text: "Autorizar edição", onclick: authorize }),
      h("button", { text: "Atualizar", onclick: load })
    ]);
    var warn = !S.postField ? "Sem o campo de data \"Data de postagem\" no quadro: usando a data de entrega como postagem." : (S.fields.length ? "" : "Este quadro ainda não tem campos personalizados do tipo lista.");
    app.replaceChildren(bar, h("p", { id: "msg", class: "note", text: warn }), h("div", { id: "counts", class: "counts" }), h("div", { id: "tbl", class: "wrap" }));
    renderTable();
  }

  function renderTable() {
    var cards = visibleCards(), noDate = noDateCards();
    var now = Date.now();
    var nExt = cards.filter(function (c) { return c.ext; }).length;
    var counts = document.getElementById("counts"); counts.replaceChildren(h("span", {}, [h("b", { text: String(cards.length - nExt) }), " vídeos", nExt ? " · " : "", nExt ? h("b", { text: String(nExt) }) : "", nExt ? " ainda no Brainstorm" : ""]));
    S.fields.forEach(function (f) {
      var pend = cards.filter(function (c) { return !c.ext; }).filter(function (c) { var t2 = optText(optOf(f, valueOf(c, f))).toLowerCase(); return t2.indexOf("conclu") < 0; }).length;
      counts.append(h("span", {}, [f.name + ": ", h("b", { text: String(pend) }), " em aberto"]));
    });
    var heads = ["Vídeo", "Projeto", "Postagem"].concat(S.fields.map(function (f) { return f.name; }));
    var trh = h("tr"); heads.forEach(function (x, i) { trh.append(h("th", { class: "nosort" + (i === 1 || i === 2 ? " fit" : ""), text: x })); });
    var tb = h("tbody"), lastWeek = null;
    function row(c) {
      var pd = postDate(c);
      if (c.ext) {
        var wd = DIAS[pd.getDay()].charAt(0).toUpperCase() + DIAS[pd.getDay()].slice(1);
        tb.append(h("tr", { class: "ext" }, [
          h("td", { class: "name" }, [h("div", { class: "nm" }, [h("span", { style: "width:16px;flex:none" }), h("div", {}, [h("a", { href: c.url, target: "_blank", rel: "noopener", text: c.name }), h("span", { class: "xtag", text: "no Brainstorm" }), h("span", { class: "sub", text: (c.extList ? c.extList + " · " : "") + "ainda não enviado" })])])]),
          h("td", { class: "fit" }, c.labels.map(function (l) { var cc = col(l.color); return h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1] + ";opacity:.7", text: l.name || " " }); })),
          h("td", { class: "fit" }, [h("span", { class: "datebtn" }, [h("span", { class: "wd", text: wd }), h("span", { text: dd(pd) })])]),
          h("td", { colspan: Math.max(1, S.fields.length), class: "note", text: "Envie pela Planilha de temas quando chegar a semana." })
        ]));
        return;
      }
      var postCell;
      var wdTxt = pd ? DIAS[pd.getDay()].charAt(0).toUpperCase() + DIAS[pd.getDay()].slice(1) : "";
      if (S.postField) {
        var inp = h("input", { type: "date", value: pd ? iso(pd) : "", "aria-label": "Data de postagem de " + c.name });
        inp.addEventListener("change", function () { setPost(c, inp.value, inp); });
        postCell = h("td", { class: "fit" }, [h("span", { class: "datebtn" }, pd ? [h("span", { class: "wd", text: wdTxt }), h("span", { text: dd(pd) }), inp] : [h("span", { class: "wd", text: "" }), h("span", { class: "note", text: "Definir data" }), inp])]);
      } else postCell = h("td", { class: "fit" }, [h("span", { class: "datebtn" }, [h("span", { class: "wd", text: wdTxt }), h("span", { text: pd ? dd(pd) : "" })])]);
      var ok = h("input", { type: "checkbox", class: "ok", title: "Vídeo pronto (postado)", "aria-label": "Vídeo pronto: " + c.name }); ok.checked = !!c.dueComplete;
      ok.addEventListener("change", function () { setDone(c, ok.checked, ok); });
      var tr = h("tr", { class: c.dueComplete ? "done" : null }, [
        h("td", { class: "name" }, [h("div", { class: "nm" }, [ok, h("div", {}, [h("a", { href: c.url, text: c.name, onclick: function (e) { e.preventDefault(); t.showCard(c.id); } }), h("span", { class: "sub", text: listName(c.idList) })])])]),
        h("td", { class: "fit" }, (c.labels || []).map(function (l) { var cc = col(l.color); return h("span", { class: "lab", style: "background:" + cc[0] + ";color:" + cc[1], text: l.name || " " }); })),
        postCell
      ]);
      S.fields.forEach(function (f) { tr.append(h("td", {}, [statusSelect(c, f)])); });
      tb.append(tr);
    }
    cards.forEach(function (c) {
      var wk = +monday(postDate(c));
      if (wk !== lastWeek) {
        var n = cards.filter(function (x) { return +monday(postDate(x)) === wk; }).length;
        tb.append(h("tr", { class: "grp" }, [h("td", { colspan: heads.length, text: weekLabel(new Date(wk)) + " · " + n })]));
        lastWeek = wk;
      }
      row(c);
    });
    if (!cards.length) tb.append(h("tr", {}, [h("td", { colspan: heads.length, class: "note", text: "Nenhum vídeo com data nesse período." })]));
    if (period === "todos" && noDate.length) {
      tb.append(h("tr", { class: "grp nodate", onclick: function () { S.showNoDate = !S.showNoDate; renderTable(); } }, [h("td", { colspan: heads.length, text: (S.showNoDate ? "▾ " : "▸ ") + "Sem data de postagem · " + noDate.length + (S.showNoDate ? "" : " (clique para abrir)") })]));
      if (S.showNoDate) noDate.forEach(row);
    }
    closeMenu();
    var tbl = document.getElementById("tbl"); tbl.onscroll = closeMenu; tbl.replaceChildren(h("table", {}, [h("thead", {}, [trh]), tb]));
  }

  load();
}
</script>
